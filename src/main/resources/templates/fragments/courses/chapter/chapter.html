<section th:fragment="chapter (chapter, isOwner)">

    <div class="accordion" th:classappend="${chapter.paywalled} ? ' paywalled' : ''">
        <input type="checkbox"
               th:id="'chapter-' + ${chapter.id}"
               style="display: none;">

        <label class="accordion-label" th:for="'chapter-' + ${chapter.id}">
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">

                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <span th:if="${chapter.paywalled}" style="color: #fbbf24;" title="Premium Inhalt">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <span th:text="${chapter.title}" style="font-weight: 600;">Chapter Title</span>
                </div>

                <div style="display: flex; align-items: center; gap: 0.5rem;">

                    <button type="button"
                            class="btn-action report"
                            th:if="${!isOwner}"
                            th:onclick="'openReportModal(\'CHAPTER\', ' + ${chapter.id} + ')'"
                            title="Inhalt melden">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                            <line x1="4" y1="22" x2="4" y2="15"></line>
                        </svg>
                    </button>

                    <th:block th:if="${isOwner}">
                        <button class="btn-action btn-edit"
                                th:onclick="|event.preventDefault(); toggleEdit(${chapter.id})|"
                                title="Bearbeiten">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                            </svg>
                        </button>

                        <div th:replace="~{fragments/buttons/deleteButton :: deleteButton(@{/tutor/chapters/delete/{id}(id=${chapter.id})})}"></div>
                    </th:block>

                    <span class="accordion-arrow" style="margin-left: 0.5rem;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </span>
                </div>
            </div>
        </label>

        <div class="accordion-content">
            <div th:text="${chapter.description}" style="padding: 1.5rem 0; line-height: 1.6;">Content</div>
        </div>
    </div>

    <div th:if="${isOwner}" class="chapter-edit-form mb-2"
         th:classappend="${#maps.isEmpty(chapter.validationErrors)} ? 'hidden' : 'scrollError'"
         th:id="'edit-chapter-' + ${chapter.id}">
        <div style="background: var(--bg-input); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 0.5rem;">
            <div th:replace="fragments/forms/form :: form(object=${chapter}, action=@{/tutor/chapters/save/{id}(id=${chapter.id})})"></div>
        </div>
    </div>

    <div th:replace="~{fragments/report-modal :: reportModal}"></div>

    <script th:inline="javascript" type="text/javascript">
        function toggleEdit(chapterId) {
            const chapter = document.getElementById('edit-chapter-' + chapterId);
            if (chapter.classList.contains('hidden')){
                chapter.classList.remove('hidden');
            } else {
                chapter.classList.add('hidden');
            }
        }
    </script>
</section>
