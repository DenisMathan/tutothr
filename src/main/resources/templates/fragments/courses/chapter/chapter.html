<section th:fragment="chapter (chapter, isOwner)">

    <!-- Wrapper mit neuer Klasse -->
    <div class="chapter-item" th:classappend="${chapter.paywalled} ? 'paywalled' : ''">
        
        <!-- Hidden Checkbox für reines CSS-Accordion -->
        <input type="checkbox"
               class="chapter-toggle"
               th:id="'chapter-' + ${chapter.id}"
               style="display: none;">

        <!-- Header / Label -->
        <label class="chapter-header" th:for="'chapter-' + ${chapter.id}">
            
            <div class="chapter-title-group">
                <!-- Premium Badge -->
                <div th:if="${chapter.paywalled}" class="badge-premium" title="Premium Inhalt (Kostenpflichtig)" data-bs-toggle="tooltip">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                
                <!-- Titel -->
                <span class="chapter-title" th:text="${chapter.title}">Kapitel Titel</span>
            </div>

            <!-- Rechte Seite: Actions & Pfeil -->
            <div class="chapter-actions">

                <!-- User Actions (Nicht-Owner) -->
                <button type="button"
                        class="btn-icon-action"
                        th:if="${!isOwner}"
                        th:onclick="'event.preventDefault(); openReportModal(\'CHAPTER\', ' + ${chapter.id} + ')'"
                        title="Inhalt melden">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                        <line x1="4" y1="22" x2="4" y2="15"></line>
                    </svg>
                </button>

                <!-- Owner Actions -->
                <th:block th:if="${isOwner}">
                    <button class="btn-icon-action"
                            th:onclick="|event.preventDefault(); toggleEdit(${chapter.id})|"
                            title="Bearbeiten">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                        </svg>
                    </button>

                    <!-- Löschen Button Integration -->
                    <div style="display:inline-block;" 
                         th:replace="~{fragments/buttons/deleteButton :: deleteButton(@{/tutor/chapters/delete/{id}(id=${chapter.id})})}">
                    </div>
                </th:block>

                <!-- Accordion Pfeil -->
                <div class="accordion-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </div>
            </div>
        </label>

        <!-- Content Bereich -->
        <div class="chapter-content">
            <div th:text="${chapter.description}">Inhalt...</div>
        </div>
    </div>

    <!-- Edit Form Container (für Tutors) -->
    <div th:if="${isOwner}" 
         class="chapter-edit-container mb-2"
         th:classappend="${#maps.isEmpty(chapter.validationErrors)} ? 'd-none' : 'scrollError'"
         th:id="'edit-chapter-' + ${chapter.id}">
         
        <h5 class="mb-3">Kapitel bearbeiten</h5>
        <div th:replace="~{fragments/forms/form :: form(object=${chapter}, action=@{/tutor/chapters/save/{id}(id=${chapter.id})})}"></div>
    </div>
    
    <!-- Report Modal nur einmalig einbinden, nicht pro Chapter mehrfach (idealerweise im Parent Template) -->
    <!-- Aber falls es hier nötig ist für Standalone-Nutzung: -->
    <div th:replace="~{fragments/report-modal :: reportModal}"></div>

    <script th:inline="javascript" type="text/javascript">
        function toggleEdit(chapterId) {
            const chapterForm = document.getElementById('edit-chapter-' + chapterId);
            if (chapterForm.classList.contains('d-none')){
                chapterForm.classList.remove('d-none');
            } else {
                chapterForm.classList.add('d-none');
            }
        }
    </script>
</section>
