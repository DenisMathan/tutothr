<!-- templates/fragments/navbar/navbar.html -->
<div th:fragment="navbar">
    <nav class="navbar404" role="navigation" aria-label="Hauptnavigation">
        <div class="navbar404-container">
            <a class="navbar404-brand" th:href="@{/}">
                <span class="navbar404-title">TUTOTHR</span>
            </a>
            <ul class="navbar404-links" role="menubar">
                <li role="none"><a role="menuitem" th:href="@{/categories}">Categories</a></li>
                <li role="none"><a role="menuitem" th:href="@{/admin/all}">Users</a></li>
                <li role="none"><a role="menuitem" th:href="@{/courses}">Kurse</a></li>
                <li role="none"><a role="menuitem" th:href="@{/einstellungen}">Einstellungen</a></li>
            </ul>
            <div class="navbar404-actions">
                <button class="navbar404-icon-btn notifications" aria-label="Benachrichtigungen">
                    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="currentColor"
                            d="M12 2a6 6 0 00-6 6v3.586L4.707 14.88A1 1 0 005 16h14a1 1 0 00.293-1.121L18 11.586V8a6 6 0 00-6-6zM7 20a5 5 0 0010 0H7z" />
                    </svg>
                    <span class="navbar404-badge" th:if="${notificationCount != null}" th:text="${notificationCount}">3</span>
                </button>
                <div class="navbar404-profile" tabindex="0" onblur="this.classList.remove('open')">
                    <button class="navbar404-profile-btn" aria-haspopup="true" aria-expanded="false"
                        onclick="this.parentElement.classList.toggle('open')">
                        <svg class="navbar404-avatar-icon" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor"
                                d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4 0-7 2-7 4v2h14v-2c0-2-3-4-7-4z" />
                        </svg>
                        <span class="navbar404-profile-name" th:text="${#authentication?.name ?: 'Profil'}">Profil</span>
                        <svg class="navbar404-caret" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" d="M7 10l5 5 5-5z" />
                        </svg>
                    </button>
                    <ul class="navbar404-profile-menu" role="menu">
                        <li role="none"><a role="menuitem" th:href="@{/profil}">Mein Profil</a></li>
                        <li role="none"><a role="menuitem" th:href="@{/account}">Account</a></li>
                        <li role="none">
                            <form th:action="@{/logout}" method="post" style="margin:0">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" role="menuitem" class="navbar404-profile-menu-item" style="background:none;border:0;padding:.5rem .8rem;width:100%;text-align:left;cursor:pointer">
                                    Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <style>
        :root {
            --bg: #0f1724;
            --card: #0b1220;
            --accent: #7c3aed;
            --muted: #9aa4b2;
            --glass: rgba(255,255,255,0.04);
        }
        .navbar404 {
            background: linear-gradient(180deg, rgba(124,58,237,0.12), transparent), linear-gradient(180deg,#071028 0%, var(--bg) 60%);
            color: #e6eef8;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            box-shadow: 0 8px 30px rgba(2,6,23,0.6);
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .navbar404-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem 1rem;
        }
        .navbar404-brand {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }
        .navbar404-title {
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 1.1rem;
            color: var(--accent);
        }
        .navbar404-links {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: .5rem;
            flex: 1;
        }
        .navbar404-links a {
            color: #e6eef8;
            text-decoration: none;
            padding: .5rem .75rem;
            border-radius: 8px;
            display: inline-block;
            background: var(--glass);
            transition: background 0.2s;
        }
        .navbar404-links a:hover {
            background: var(--accent);
            color: #fff;
        }
        .navbar404-actions {
            display: flex;
            align-items: center;
            gap: .5rem;
        }
        .navbar404-icon-btn {
            background: transparent;
            border: 0;
            color: inherit;
            padding: .4rem;
            border-radius: 8px;
            position: relative;
        }
        .navbar404-icon-btn:hover {
            background: var(--glass);
        }
        .navbar404-badge {
            position: absolute;
            top: 2px;
            right: 2px;
            min-width: 18px;
            height: 18px;
            line-height: 18px;
            font-size: 12px;
            background: #ff4d4f;
            color: #fff;
            border-radius: 999px;
            display: inline-block;
            text-align: center;
            padding: 0 5px;
        }
        .navbar404-profile {
            position: relative;
        }
        .navbar404-profile-btn {
            display: flex;
            align-items: center;
            gap: .5rem;
            background: transparent;
            border: 0;
            color: inherit;
            padding: .25rem .4rem;
            border-radius: 8px;
        }
        .navbar404-avatar-icon {
            background: var(--glass);
            padding: 3px;
            border-radius: 50%;
        }
        .navbar404-profile-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            background: var(--card);
            color: #e6eef8;
            min-width: 160px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(3, 10, 18, 0.12);
            padding: .4rem 0;
            display: none;
            list-style: none;
            margin: 0;
        }
        .navbar404-profile.open .navbar404-profile-menu {
            display: block;
        }
        .navbar404-profile-menu a {
            display: block;
            padding: .5rem .8rem;
            color: inherit;
            text-decoration: none;
            border-radius: 8px;
        }
        .navbar404-profile-menu a:hover {
            background: var(--accent);
            color: #fff;
        }
        .navbar404-profile-menu-item {
            color: inherit;
        }
        /* Responsive */
        @media (max-width:800px) {
            .navbar404-links {
                display: none;
            }
            .navbar404-container.open .navbar404-links {
                display: flex;
                position: absolute;
                left: 0;
                right: 0;
                top: 56px;
                background: var(--card);
                flex-direction: column;
                padding: .5rem 1rem;
                gap: 0.25rem;
            }
        }
    </style>

    <script>
        // close profile menu when clicking outside
        document.addEventListener('click', function (e) {
            document.querySelectorAll('.navbar404-profile.open').forEach(function (p) {
                if (!p.contains(e.target)) p.classList.remove('open');
            });
        });
    </script>
</div>
