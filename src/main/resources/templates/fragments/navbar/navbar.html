<!-- templates/fragments/navbar/navbar.html -->
<div th:fragment="navbar">
    <nav class="navbar404" role="navigation" aria-label="Hauptnavigation">
        <div class="navbar404-container">
            <a class="navbar404-brand" th:href="@{/}">
                <span class="navbar404-title">TUTOTHR</span>
            </a>
            <ul class="navbar404-links" role="menubar">
                <li role="none"><a role="menuitem" th:href="@{/admin/categories}">Categories</a></li>
                <li role="none"><a role="menuitem" th:href="@{/admin/all}">Users</a></li>
                <li role="none"><a role="menuitem" th:href="@{/courses}">Kurse</a></li>
                <li role="none"><a role="menuitem" th:href="@{/einstellungen}">Einstellungen</a></li>
                <li role="none"><a role="menuitem" th:href="@{/messages/inbox}">Nachrichten</a></li>
                <li role="none"><a role="menuitem" th:href="@{/dashboard}">Dashboard</a></li>
            </ul>
            <div class="navbar404-actions">
                <button class="navbar404-icon-btn notifications" aria-label="Benachrichtigungen">
                    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="currentColor"
                              d="M12 2a6 6 0 00-6 6v3.586L4.707 14.88A1 1 0 005 16h14a1 1 0 00.293-1.121L18 11.586V8a6 6 0 00-6-6zM7 20a5 5 0 0010 0H7z" />
                    </svg>
                    <span class="navbar404-badge" th:if="${notificationCount != null}" th:text="${notificationCount}">3</span>
                </button>
                <div class="navbar404-profile" tabindex="0" onblur="this.classList.remove('open')">
                    <button class="navbar404-profile-btn" aria-haspopup="true" aria-expanded="false"
                            onclick="this.parentElement.classList.toggle('open')">
                        <svg class="navbar404-avatar-icon" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor"
                                  d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4 0-7 2-7 4v2h14v-2c0-2-3-4-7-4z" />
                        </svg>
                        <span class="navbar404-profile-name" th:text="${#authentication?.name ?: 'Profil'}">Profil</span>
                        <svg class="navbar404-caret" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true">
                            <path fill="currentColor" d="M7 10l5 5 5-5z" />
                        </svg>
                    </button>
                    <ul class="navbar404-profile-menu" role="menu">
                        <li role="none"><a role="menuitem" th:href="@{/profil}">Mein Profil</a></li>
                        <li role="none"><a role="menuitem" th:href="@{/account}">Account</a></li>
                        <li role="none">
                            <form th:action="@{/logout}" method="post" style="margin:0">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" role="menuitem" class="navbar404-logout-btn">
                                    Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <script>
        // close profile menu when clicking outside
        document.addEventListener('click', function (e) {
            document.querySelectorAll('.navbar404-profile.open').forEach(function (p) {
                if (!p.contains(e.target)) p.classList.remove('open');
            });
        });
    </script>
</div>
