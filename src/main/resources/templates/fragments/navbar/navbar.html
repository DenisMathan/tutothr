<div th:fragment="navbar" xmlns:sec="http://www.w3.org/1999/xhtml">
    <nav class="navbar404" role="navigation">
        <div class="navbar404-container">
            <a class="navbar404-brand" th:href="@{/}">
                <span class="navbar404-title">TUTOTHR</span>
            </a>

            <ul class="navbar404-links">
                <li><a th:href="@{/courses}">Kurse</a></li>
                <li><a th:href="@{/messages/inbox}">Nachrichten</a></li>
                <li sec:authorize="hasRole('TUTOR')"><a th:href="@{/tutor/timeslots}">Zeitslots</a></li>
            </ul>

            <div class="navbar404-actions">
                <button class="navbar404-icon-btn" onclick="toggleTheme()" aria-label="Design wechseln">
                    <svg id="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg id="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>

                <button class="navbar404-icon-btn notifications">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span class="navbar404-badge" th:if="${notificationCount != null}" th:text="${notificationCount}">3</span>
                </button>

                <div class="navbar404-profile" tabindex="0" onblur="this.classList.remove('open')">
                    <button class="navbar404-profile-btn" onclick="this.parentElement.classList.toggle('open')">
                        <svg class="navbar404-avatar-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <span class="navbar404-profile-name" th:text="${#authentication?.name ?: 'Profil'}">Profil</span>
                        <svg class="navbar404-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <ul class="navbar404-profile-menu">
                        <li><a th:href="@{/profil}">Mein Profil</a></li>
                        <li><a th:href="@{/account}">Account</a></li>
                        <li>
                            <form th:action="@{/logout}" method="post" style="margin:0">
                                <button type="submit" class="navbar404-logout-btn">Logout</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
</div>
