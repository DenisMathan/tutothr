<!--
  Erwartet:
  - "fields": Liste von Field-Objekten (z.B. java.lang.reflect.Field oder eigene DTOs)
  - "object": das zu bearbeitende Objekt
-->

<form th:fragment="form(object,action)" 
      th:action="@{${action}}" 
      th:object="${object}" 
      method="post" 
      enctype="multipart/form-data"
      xmlns:th="http://www.thymeleaf.org">

    <input type="hidden" name="_method" th:if="*{id != null}" value="put" />
    <input type="hidden" name="id" th:if="*{id != null}" th:value="*{id}" />
    
    <div th:each="field : *{formFields}" class="mb-3">
        <input th:if="${field.type == 'hidden'}" type="hidden" th:id="${field.name}" th:name="${field.name}" th:value="*{__${field.name}__}"/>
        
        <div class="form-group">
            <input type="hidden" name="fields" th:value="${field.name}" />
            
            <!-- Label with proper styling (muted text) -->
            <label th:if="${field.type != 'hidden' and field.type != 'checkbox'}" 
                   th:for="${field.name}" 
                   th:text="${field.label}"
                   style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; font-weight: 500;">
            </label>
            
            <!-- Inputs using .form-input from style.css -->
            <input th:if="${field.type == 'text' or field.type == 'number' or field.type == 'password' or field.type == 'email'}" 
                   step="any" 
                   class="form-input" 
                   th:type="${field.type}" 
                   th:id="${field.name}" 
                   th:name="${field.name}" 
                   th:value="*{__${field.name}__}"
                   th:readonly="${field.readonly}"
                   th:classappend="${field.readonly} ? ' bg-light text-muted' : ''" />

            <!-- File Input -->
            <input th:if="${field.type == 'file'}" 
                   class="form-control" 
                   type="file" 
                   multiple 
                   th:id="${field.name}" 
                   th:name="${field.name}" 
                   accept=".pdf" />

            <!-- Textarea using .form-textarea from style.css -->
            <textarea th:if="${field.type == 'textarea'}" 
                      class="form-textarea" 
                      rows="4"
                      th:id="${field.name}" 
                      th:name="${field.name}" 
                      th:text="*{__${field.name}__}"
                      th:readonly="${field.readonly}"
                      th:classappend="${field.readonly} ? ' bg-light text-muted' : ''"></textarea>
            
            <!-- Group of Checkboxes (Tags Style) -->
            <div th:if="${field.type == 'group'}" class="d-flex flex-wrap gap-2 mt-2">
                 <div th:each="subField : ${field.subFields}">
                     <input type="hidden" th:name="'_'+${subField.name}" value="on"/>
                     <input type="checkbox" 
                            class="btn-check" 
                            th:id="${subField.name}" 
                            th:name="${subField.name}" 
                            th:checked="*{__${subField.name}__}" 
                            autocomplete="off"
                            th:disabled="${field.readonly or subField.readonly}">
                     <label class="btn btn-tag btn-sm rounded-pill" 
                            th:for="${subField.name}" 
                            th:text="${subField.label}"
                            th:classappend="${(subField.readonly) ? ' disabled' : ''}"
                            th:style="${(field.readonly or subField.readonly) ? 'pointer-events: none; opacity: 0.65;' : ''}"></label>
                 </div>
            </div>

            <!-- Checkbox Group from Options -->
            <div th:if="${field.type == 'checkbox-group'}" class="d-flex flex-wrap gap-2 mt-2">
                 <div th:each="opt : ${field.options}">
                     <input type="checkbox" 
                            class="btn-check" 
                            th:id="${field.name + '-' + opt.value}" 
                            th:name="${field.name}" 
                            th:value="${opt.value}"
                            th:checked="${object['__${field.name}__'] != null and #lists.contains(object['__${field.name}__'], opt.value)}"
                            autocomplete="off"
                            th:disabled="${field.readonly}">
                     <label class="btn btn-tag btn-sm rounded-pill" 
                            th:for="${field.name + '-' + opt.value}" 
                            th:text="${opt.label}"
                            th:classappend="${field.readonly ? ' disabled' : ''}"></label>
                 </div>
            </div>

            <!-- Single Checkbox -->
            <div th:if="${field.type == 'checkbox'}" class="form-check mt-2">
                <input type="hidden" th:name="'_'+${field.name}" value="on"/>
                <input class="form-check-input" 
                       type="checkbox" 
                       th:id="${field.name}" 
                       th:name="${field.name}" 
                       th:checked="*{__${field.name}__}"
                       th:disabled="${field.readonly}">
                <label class="form-check-label" 
                       th:for="${field.name}" 
                       th:text="${field.label}"
                       style="color: var(--text-main);">
                </label>
            </div>

            <!-- Error message styled nicely -->
            <span th:if="${object.hasValidationError(field.name)}" 
                  th:text="${object.getValidationError(field.name)}" 
                  class="form-error"
                  style="color: var(--status-error, #ef4444); font-size: 0.85rem; margin-top: 0.4rem; display: block;">
            </span>
        </div>
    </div>
    
    <!-- Button using .btn-primary from style.css -->
    <button type="submit" 
            class="btn-primary w-100" 
            style="justify-content: center; margin-top: 1rem; height: 48px; font-size: 1rem;" 
            th:text="${object.submitLabel} ?: #{common.save}">
        Speichern
    </button>
</form>
