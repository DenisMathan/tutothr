<div th:fragment="roundButton (icon, jsFunctionName)" class="d-flex justify-content-center my-4" xmlns:th="http://www.thymeleaf.org">
    <button th:attr="onclick=${jsFunctionName}" 
            class="btn-fab-flat" 
            type="button"
            th:title="#{chapter.add.new}">
        
        <!-- Plus Icon -->
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
    </button>
</div>
