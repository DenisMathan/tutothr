<form th:fragment="deleteButton (action)" th:if="${isOwner}" th:action="${action}" method="post">
    <input type="hidden" name="_method" value="delete"/>
    <button class="btn-danger " type="submit"> 
        <img class="w-1 h-1" style="width: 1rem; height: 1rem;" src="https://img.icons8.com/?size=100&id=85194&format=png&color=000000" alt="Delete"/>
    </button>
</form>
