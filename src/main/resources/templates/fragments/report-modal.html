<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="reportModal">

    <input type="hidden" id="report-target-type">
    <input type="hidden" id="report-target-id">

    <div id="report-modal" class="modal-overlay">

        <div class="modal-card">

            <div class="modal-header">
                <div class="modal-title-row">
                    <div class="modal-icon-wrapper">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2">
                            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                            <line x1="4" y1="22" x2="4" y2="15"></line>
                        </svg>
                    </div>
                    <h3 id="report-modal-title" class="modal-title" th:text="#{report.content}">Inhalt melden</h3>
                </div>
                <p class="modal-subtitle" th:text="#{report.help.community}">
                    Hilf uns, die Community sicher zu halten
                </p>
            </div>

            <div class="modal-body">
                <div style="margin-bottom: 1.5rem;">
                    <label class="modal-label" for="report-category" th:text="#{report.what.problem}">Was ist das Problem?</label>
                    <select id="report-category" class="form-input" style="cursor: pointer;">
                        <option value="" th:text="#{report.select.category}">Kategorie wählen...</option>
                        <option value="Spam" th:text="#{report.category.spam}">Spam</option>
                        <option value="Beleidigung" th:text="#{report.category.hate}">Beleidigung / Hassrede</option>
                        <option value="Unangemessener Inhalt" th:text="#{report.category.inappropriate}">Unangemessener Inhalt</option>
                        <option value="Betrug" th:text="#{report.category.scam}">Betrug / Scam</option>
                        <option value="Urheberrecht" th:text="#{report.category.copyright}">Urheberrechtsverletzung</option>
                        <option value="Sonstiges" th:text="#{report.category.other}">Sonstiges</option>
                    </select>
                </div>

                <div>
                    <label class="modal-label" for="report-details">
                        <span th:text="#{report.details}">Details</span> <span class="text-muted" style="font-weight: 400;" th:text="'(' + #{common.optional} + ')'"></span>
                    </label>
                    <textarea id="report-details"
                              class="form-textarea"
                              rows="4"
                              th:placeholder="#{report.details.placeholder}"></textarea>
                </div>
            </div>

            <div class="modal-footer">
                <button onclick="closeReportModal()" class="btn-secondary" th:text="#{common.cancel}">
                    Abbrechen
                </button>
                <button onclick="submitReport()" class="btn-danger" style="background: #ef4444; color: white; border: none;" th:text="#{report.send}">
                    Meldung absenden
                </button>
            </div>
        </div>
    </div>

    <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 0.5rem;"></div>

    <script th:inline="javascript">
        const reportTitleMessage = /*[[#{report.message}]]*/ 'Nachricht melden';
        const reportTitleCourse = /*[[#{report.course}]]*/ 'Kurs melden';
        const reportTitleChapter = /*[[#{report.chapter}]]*/ 'Kapitel melden';
        const reportTitleContent = /*[[#{report.content}]]*/ 'Inhalt melden';
        const reportTitleHashtag = 'Hashtag melden';
        const reportSelectCategory = /*[[#{report.please.select.category}]]*/ 'Bitte wähle eine Kategorie aus';
        const reportError = /*[[#{common.error.occurred}]]*/ 'Ein Fehler ist aufgetreten';

        function openReportModal(type, id) {
            document.getElementById('report-target-type').value = type;
            document.getElementById('report-target-id').value = id;
            document.getElementById('report-category').value = '';
            document.getElementById('report-details').value = '';

            const titleElem = document.getElementById('report-modal-title');
            if (type === 'MESSAGE') titleElem.textContent = reportTitleMessage;
            else if (type === 'COURSE') titleElem.textContent = reportTitleCourse;
            else if (type === 'CHAPTER') titleElem.textContent = reportTitleChapter;
            else if (type === 'HASHTAG') titleElem.textContent = reportTitleHashtag;
            else titleElem.textContent = reportTitleContent;

            document.getElementById('report-modal').style.display = 'flex';
        }

        function closeReportModal() {
            document.getElementById('report-modal').style.display = 'none';
        }

        function submitReport() {
            const type = document.getElementById('report-target-type').value;
            const id = document.getElementById('report-target-id').value;
            const category = document.getElementById('report-category').value;
            const details = document.getElementById('report-details').value;

            if (!category) {
                showToast(reportSelectCategory, 'error');
                return;
            }

            const reason = details ? `${category}: ${details}` : category;

            let url = '';
            if (type === 'MESSAGE') url = `/messages/${id}/report`;
            else if (type === 'COURSE') url = `/courses/${id}/report`;
            else if (type === 'CHAPTER') url = `/chapters/${id}/report`;
            else if (type === 'HASHTAG') url = `/hashtags/${id}/report`;

            const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

            const headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
            if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;

            fetch(url, {
                method: 'POST',
                headers: headers,
                body: `reason=${encodeURIComponent(reason)}`
            })
                .then(response => response.json())
                .then(data => {
                    closeReportModal();
                    if (data.status === 'success') showToast(data.message, 'success');
                    else showToast(data.message || reportError, 'error');
                })
                .catch(error => {
                    console.error('Error:', error);
                    closeReportModal();
                    showToast(reportError, 'error');
                });
        }

        function showToast(message, type) {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            toast.textContent = message;
            toast.className = `toast-card ${type === 'success' ? 'toast-success' : 'toast-error'}`;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideOutRight 0.3s ease-in forwards';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeReportModal();
        });
        document.addEventListener('click', (e) => {
            if (e.target.id === 'report-modal') closeReportModal();
        });
    </script>
</div>
</html>
