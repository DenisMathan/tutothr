<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <title>Erhaltene Buchungen</title>
</head>

<body>
<section layout:fragment="mybody">
  <div class="container" style="max-width: 1200px; margin: 2rem auto; padding: 0 1rem;">

    <h1 class="text-main" style="margin-bottom: 2rem; font-weight: 700;">Erhaltene Buchungen</h1>

    <div th:if="${bookings.isEmpty()}" class="no-ratings">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <p>Noch keine Buchungen erhalten.</p>
    </div>

    <div th:if="${!bookings.isEmpty()}" class="table-wrapper">
      <table class="styled-table">
        <thead>
        <tr>
          <th>Student</th>
          <th>Kurs</th>
          <th>Termin</th>
          <th>Preis</th>
          <th>Status</th>
          <th class="text-end">Beleg</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="booking : ${bookings}">
          <td>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <div style="background: var(--bg-hover); padding: 4px; border-radius: 50%; color: var(--accent);">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4 0-7 2-7 4v2h14v-2c0-2-3-4-7-4z"/></svg>
              </div>
              <span th:text="${booking.studentName}">Student</span>
            </div>
          </td>
          <td style="font-weight: 600;" th:text="${booking.courseName}"></td>
          <td class="text-muted" th:text="${booking.timeSlotDisplay}"></td>
          <td th:text="${#numbers.formatDecimal(booking.price, 1, 2) + ' €'}"></td>
          <td>
            <span th:if="${booking.status.name() == 'PENDING'}" class="badge status-pending">Ausstehend</span>
            <span th:if="${booking.status.name() == 'CONFIRMED'}" class="badge status-confirmed">Bezahlung eingegangen</span>
            <span th:if="${booking.status.name() == 'COMPLETED'}" class="badge status-completed">Abgeschlossen</span>
            <span th:if="${booking.status.name() == 'CANCELLED'}" class="badge status-cancelled">Storniert</span>
          </td>
          <td class="text-end">
            <a th:if="${booking.invoiceId != null}"
               th:href="@{/tutor/invoice/{id}/download(id=${booking.invoiceId})}"
               class="btn-secondary btn-sm">
              Beleg PDF
            </a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    <div th:if="${totalPages > 1}" style="margin-top: 2rem;">
      <div th:replace="~{fragments/pagination :: render(${currentPage}, ${totalPages})}"></div>
    </div>
  </div>
</section>
</body>
</html>
