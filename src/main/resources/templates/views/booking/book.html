<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <title>Termin buchen</title>
</head>

<body>
<section layout:fragment="mybody">
  <div class="container" style="max-width: 600px; margin: 2rem auto; padding: 0 1rem;">

    <div class="form-header">
      <h2 class="form-title">Termin buchen</h2>
      <p class="form-subtitle" th:text="${course.title}" style="color: var(--accent);">Kurs Titel</p>
    </div>

    <div th:if="${error}" class="alert-info" style="border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.1); margin-bottom: 1rem;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span th:text="${error}">Fehler</span>
    </div>

    <div th:if="${timeSlots.isEmpty()}" class="no-ratings">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <p>Aktuell sind keine Termine für diesen Kurs verfügbar.</p>
      <div style="margin-top: 1.5rem;">
        <a th:href="@{/courses}" class="btn-secondary">Zurück zu den Kursen</a>
      </div>
    </div>

    <form th:if="${!timeSlots.isEmpty()}" th:action="@{/course/{id}/book(id=${course.id})}" method="post" class="card-base" style="padding: 2rem;">

      <div class="form-group">
        <label for="timeSlotId" class="form-label">Wähle einen Termin</label>
        <select name="timeSlotId" id="timeSlotId" class="form-input" required style="cursor: pointer;">
          <option value="">-- Bitte wählen --</option>
          <option th:each="slot : ${timeSlots}"
                  th:value="${slot.id}"
                  th:text="${slot.date} + ' (' + ${slot.startTime} + ' - ' + ${slot.endTime} + ')'">
          </option>
        </select>
      </div>

      <div class="form-group" style="background: var(--bg-hover); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color);">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span class="text-muted">Preis pro Einheit:</span>
          <span style="font-weight: 700; font-size: 1.2rem; color: var(--text-main);" th:text="${#numbers.formatDecimal(course.price, 1, 2) + ' €'}"></span>
        </div>
      </div>

      <div class="form-actions">
        <a th:href="@{/courses}" class="btn-secondary">Abbrechen</a>
        <button type="submit" class="btn-primary">Jetzt verbindlich buchen</button>
      </div>
    </form>

  </div>
</section>
</body>
</html>
