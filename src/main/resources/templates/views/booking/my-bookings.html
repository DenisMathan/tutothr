<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <title th:text="#{bookings.title}">Meine Buchungen</title>
</head>

<body>
<section layout:fragment="mybody">
  <div class="container" style="max-width: 1200px; margin: 2rem auto; padding: 0 1rem;">

    <h1 class="text-main" style="margin-bottom: 2rem; font-weight: 700;" th:text="#{bookings.title}">Meine Buchungen</h1>

    <div th:if="${success}" class="alert-info" style="border-color: #10b981; color: #10b981; background: rgba(16, 185, 129, 0.1); margin-bottom: 1.5rem;">
      <span th:text="#{bookings.payment.success}">Zahlung erfolgreich!</span>
    </div>
    <div th:if="${error}" class="alert-info" style="border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.1); margin-bottom: 1.5rem;">
      <span th:text="#{bookings.payment.error}">Zahlung fehlgeschlagen.</span>
    </div>

    <div th:if="${bookings.isEmpty()}" class="no-ratings">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      <p th:text="#{bookings.empty}">Du hast noch keine Kurse gebucht.</p>
      <div style="margin-top: 1rem;"><a th:href="@{/courses}" class="btn-primary" th:text="#{bookings.discover}">Kurse entdecken</a></div>
    </div>

    <div th:if="${!bookings.isEmpty()}" class="table-wrapper">
      <table class="styled-table">
        <thead>
        <tr>
          <th th:text="#{bookings.booking}">Buchung</th>
          <th th:text="#{common.price}">Preis</th>
          <th th:text="#{common.status}">Status</th>
          <th th:text="#{common.actions}">Aktion</th>
          <th class="text-end" th:text="#{bookings.receipt}">Beleg</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="booking : ${bookings}">
          <td style="font-weight: 600;" th:text="${booking.bookingDescription}"></td>
          <td th:text="${#numbers.formatDecimal(booking.price, 1, 2) + ' €'}"></td>
          <td>
            <span th:if="${booking.status.name() == 'PENDING'}" class="badge status-pending" th:text="#{bookings.status.pending}">Ausstehend</span>
            <span th:if="${booking.status.name() == 'CONFIRMED'}" class="badge status-confirmed" th:text="#{bookings.status.confirmed}">Bezahlt</span>
            <span th:if="${booking.status.name() == 'COMPLETED'}" class="badge status-completed" th:text="#{bookings.status.completed}">Abgeschlossen</span>
            <span th:if="${booking.status.name() == 'CANCELLED'}" class="badge status-cancelled" th:text="#{bookings.status.cancelled}">Storniert</span>
          </td>
          <td>
            <a th:if="${booking.status.name() == 'PENDING'}"
               th:href="@{/booking/{id}/pay(id=${booking.id})}"
               class="btn-primary btn-sm"
               th:text="#{bookings.pay.now}">
              Jetzt bezahlen
            </a>
            <a th:if="${booking.status.name() == 'PENDING'}"
               th:href="@{/booking/{id}/cancel(id=${booking.id})}"
               class="btn-secondary btn-sm"
               style="margin-left: 5px;"
               th:onclick="'return confirm(\'' + #{bookings.cancel.confirm} + '\');'"
               th:text="#{bookings.cancel}">
              Stornieren
            </a>
            <a th:if="${booking.status.name() == 'CONFIRMED'}"
               th:href="@{/booking/{id}/add-to-calendar(id=${booking.id})}"
               class="btn-secondary btn-sm"
               style="margin-left: 5px;"
               th:title="#{bookings.sync.calendar}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <span th:text="#{bookings.sync.calendar}">Sync</span>
            </a>
          </td>
          <td class="text-end">
            <a th:if="${booking.invoiceId != null}"
               th:href="@{/invoice/{id}/download(id=${booking.invoiceId})}"
               class="btn-secondary btn-sm" th:title="#{invoice.download}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              PDF
            </a>
        </tr>
        </tbody>
      </table>
    </div>
    <div th:if="${totalPages > 1}" style="margin-top: 2rem;">
      <div th:replace="~{fragments/pagination::render(${currentPage}, ${totalPages})}"></div>
    </div>
  </div>

  <script>
    // Auto-hide Alerts
    setTimeout(function() {
      const alerts = document.querySelectorAll('.alert-info');
      alerts.forEach(alert => {
        alert.style.transition = 'opacity 0.5s ease';
        alert.style.opacity = '0';
        setTimeout(() => alert.remove(), 500);
      });
    }, 3000);
  </script>

</section>
</body>
</html>
