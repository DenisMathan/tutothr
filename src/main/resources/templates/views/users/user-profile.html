<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">

<head>
    <title th:text="${user.username}">Benutzerprofil</title>
</head>

<section layout:fragment="mybody">
    <div class="container" style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
        
        <!-- Header / Zurück Button (ähnlich wie user-all) -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h1 style="font-weight: 700; margin: 0; color: var(--text-main);" th:text="${user.username}">Mein Profil</h1>
            </div>
        </div>

        <!-- Card Container im gleichen Stil wie Course-Cards -->
        <div class="course-card" style="padding: 0; overflow: hidden;">
            
            <!-- Profil Header -->
            <div style="background: var(--bg-hover); padding: 2rem; display: flex; align-items: center; gap: 1.5rem; border-bottom: 1px solid var(--border-color);">
                <!-- Avatar Circle -->
                <div style="width: 80px; height: 80px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white;">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div>
                    <h2 class="h3 margin-bottom-0" style="margin: 0; color: var(--text-main);" th:text="${user.username}">Username</h2>
                    <div style="display: flex; gap: 1rem; margin-top: 0.5rem;">
                         <span class="badge" style="background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted); padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.85rem;" 
                               th:text="'ID: ' + ${user.id}">ID: 123</span>
                    </div>
                </div>
            </div>

            <!-- Formular Body -->
            <div style="padding: 2rem;">
                 <div th:replace="~{fragments/forms/form :: form(object=${user}, action=@{/admin/user/save/{id}(id=${user.id})})}"></div>
            </div>
            
        </div>
    </div>
</section>

</html>
