<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">

<head>
    <title th:text="${user.username}">Benutzerprofil</title>
</head>

<section layout:fragment="mybody">
    <div class="profile-container">

        <!-- Admin Actions Section - Nur für Admins sichtbar -->
        <div class="admin-actions" sec:authorize="hasRole('ADMIN')" th:if="${!isOwnProfile}">
            <h3 class="admin-actions-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                Admin Aktionen
                <span class="admin-badge">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                    </svg>
                    ADMIN
                </span>
            </h3>

            <div class="admin-actions-grid">
                <!-- Entsperren Button -->
                <form th:if="${user.accountNonLocked == false}"
                      th:action="@{/admin/users/{id}/unban(id=${user.id})}"
                      method="post"
                      onsubmit="return confirm('Möchtest du diesen Benutzer wirklich entsperren?');">
                    <button type="submit" class="admin-action-btn action-green">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
                        </svg>
                        <div>
                            <div>Benutzer entsperren</div>
                            <div class="admin-action-description">
                                Zugriff wiederherstellen und Strikes zurücksetzen
                            </div>
                        </div>
                    </button>
                </form>

                <!-- Sperren Button -->
                <form th:if="${user.accountNonLocked != false}"
                      th:action="@{/admin/users/{id}/ban(id=${user.id})}"
                      method="post"
                      onsubmit="return confirm('Möchtest du diesen Benutzer wirklich sperren?');">
                    <button type="submit" class="admin-action-btn action-red">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <div>
                            <div>Benutzer sperren</div>
                            <div class="admin-action-description">
                                Zugriff komplett entziehen
                            </div>
                        </div>
                    </button>
                </form>

                <!-- Strikes zurücksetzen Button -->
                <form th:if="${user.strikes > 0}"
                      th:action="@{/admin/users/{id}/reset-strikes(id=${user.id})}"
                      method="post"
                      onsubmit="return confirm('Möchtest du die Strikes wirklich zurücksetzen?');">
                    <button type="submit" class="admin-action-btn action-warning">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="1 4 1 10 7 10"/>
                            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                        </svg>
                        <div>
                            <div>Strikes zurücksetzen</div>
                            <div class="admin-action-description">
                                Aktuelle Strikes: <span th:text="${user.strikes}">0</span> → Auf 0 setzen
                            </div>
                        </div>
                    </button>
                </form>
            </div>
        </div>

        <!-- Card Container im gleichen Stil wie Course-Cards -->
        <div class="course-card">

            <!-- Profil Header -->
            <div class="profile-header">
                <!-- Avatar Circle -->
                <div class="profile-avatar">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <div class="profile-info">
                    <h2 class="h3 profile-username" th:text="${user.username}">Username</h2>
                    <div class="profile-badges">
                        <span class="profile-badge" th:text="'ID: ' + ${user.id}">ID: 123</span>

                        <!-- Status Badge -->
                        <span th:if="${user.accountNonLocked == false}" class="badge status-cancelled">
                            🔒 GESPERRT
                        </span>
                        <span th:if="${user.active && user.accountNonLocked != false}" class="badge status-active">
                            ✓ Aktiv
                        </span>

                        <!-- Strikes Badge -->
                        <span th:if="${user.strikes > 0}"
                              class="badge"
                              th:classappend="${user.strikes >= 2} ? 'status-cancelled' : 'status-pending'"
                              th:text="'⚠️ ' + ${user.strikes} + ' Strike(s)'">
                            ⚠️ 0 Strike(s)
                        </span>
                    </div>
                </div>

                <div class="profile-actions">
                    <form th:if="${isOwnProfile}" th:action="@{/user/delete/self}" method="post"
                          onsubmit="return confirm('Möchtest du deinen Account wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden.');">
                        <input type="hidden" name="_method" value="delete"/>
                        <button type="submit" class="btn-danger">
                            Deinen Account löschen
                        </button>
                    </form>

                    <!-- Admin Delete Button - Nur für Admins bei fremden Profilen -->
                    <form th:if="${!isOwnProfile}" sec:authorize="hasRole('ADMIN')"
                          th:action="@{/user/delete/{id}(id=${user.id})}" method="post"
                          onsubmit="return confirm('Möchtest du diesen Account wirklich PERMANENT löschen? Diese Aktion kann nicht rückgängig gemacht werden!');">
                        <input type="hidden" name="_method" value="delete"/>
                        <button type="submit" class="btn-danger">
                            Account löschen
                        </button>
                    </form>
                </div>
            </div>

            <!-- Formular Body -->
            <div class="profile-body">
                <div th:replace="~{fragments/forms/form :: form(object=${user}, action=@{/user/save/{id}(id=${user.id})})}">
                </div>
            </div>

        </div>
    </div>
</section>

</html>
