<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">
<head>
    <title th:text="#{users.management}">Benutzerverwaltung</title>
</head>

<section layout:fragment="mybody">
    <div class="user-table-container">

        <div class="user-table-header">
            <div>
                <h1 class="text-main user-table-title" th:text="#{users.management}">Benutzerverwaltung</h1>
                <p class="text-muted user-count" th:text="#{users.found} + ': ' + ${totalItems}"></p>
            </div>
            <a th:href="@{/}" class="btn-secondary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span th:text="#{common.back}">Zurück</span>
            </a>
        </div>

        <div th:if="${successMessage}" class="alert-box alert-success">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span th:text="${successMessage}"></span>
        </div>

        <div th:if="${errorMessage}" class="alert-box alert-error">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="15" y1="9" x2="9" y2="15"/>
                <line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="filter-tabs">
            <a th:href="@{/admin/all}"
               th:classappend="${filter == null} ? 'active' : ''"
               class="filter-tab"
               th:text="#{users.all}">
                Alle User
            </a>
            <a th:href="@{/admin/all(filter='banned')}"
               th:classappend="${filter == 'banned'} ? 'active' : ''"
               class="filter-tab">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <span th:text="#{users.banned}">Gesperrt</span>
            </a>
            <a th:href="@{/admin/all(filter='strikes')}"
               th:classappend="${filter == 'strikes'} ? 'active' : ''"
               class="filter-tab">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                    <line x1="12" y1="9" x2="12" y2="13"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
                <span th:text="#{users.with.strikes}">Mit Strikes</span>
            </a>
        </div>

        <div class="table-wrapper">
            <table class="styled-table">
                <thead>
                <tr>
                    <th class="col-id">ID</th>
                    <th th:text="#{users.login}">Login</th>
                    <th th:text="#{users.email}">Email</th>
                    <th th:text="#{users.roles}">Rollen</th>
                    <th th:text="#{users.status}">Status</th>
                    <th>Strikes</th>
                    <th th:text="#{users.created.at}">Erstellt am</th>
                    <th class="text-end" th:text="#{common.action}">Aktion</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}" th:if="${user != null}">
                    <td class="text-muted" th:text="${user.id}">1</td>
                    <td>
                        <div class="user-info-row">
                            <div class="user-avatar-circle">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4 0-7 2-7 4v2h14v-2c0-2-3-4-7-4z"/>
                                </svg>
                            </div>
                            <span th:text="${user.username}">User</span>
                        </div>
                    </td>
                    <td class="text-muted" th:text="${user.email}">email@test.de</td>
                    <td>
                        <span th:each="role : ${user.roles}"
                              class="role-tag"
                              th:text="${role}">
                        </span>
                    </td>
                    <td>
                        <span th:if="${user.accountNonLocked == false}" class="badge status-cancelled" th:text="#{users.status.banned}">
                            GESPERRT
                        </span>

                        <span th:if="${user.active && user.accountNonLocked != false}" class="badge status-active" th:text="#{users.status.active}">
                            Aktiv
                        </span>

                        <span th:if="${!user.active && user.accountNonLocked != false}" class="badge status-inactive" th:text="#{users.status.inactive}">
                            Inaktiv
                        </span>
                    </td>
                    <td>
                        <span th:if="${user.strikes > 0}"
                              class="badge"
                              th:classappend="${user.strikes >= 2} ? 'status-cancelled' : 'status-pending'"
                              th:text="'⚠️ ' + ${user.strikes}">
                            ⚠️ 0
                        </span>
                        <span th:if="${user.strikes == 0}" class="text-muted">-</span>
                    </td>
                    <td class="text-muted" th:text="${#temporals.format(user.createdAt, 'dd.MM.yyyy')}">01.01.2025</td>
                    <td class="text-end">
                        <a th:href="@{'/user/' + ${user.id}}" class="btn-action" th:title="#{users.show.profile}">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:replace="~{fragments/pagination :: render(${currentPage}, ${totalPages})}"></div>

    </div>
</section>
</html>
