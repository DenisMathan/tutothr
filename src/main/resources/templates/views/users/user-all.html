<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">
<head>
    <title>Benutzerverwaltung</title>
</head>

<section layout:fragment="mybody">
    <div class="container" style="max-width: 1200px; margin: 2rem auto; padding: 0 1rem;">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h1 class="text-main" style="margin: 0; font-weight: 700;">Benutzerliste</h1>
                <p class="text-muted" style="margin: 0.5rem 0 0 0;" th:text="'Gefundene Benutzer: ' + ${totalItems}"></p>
            </div>
            <a th:href="@{/}" class="btn-secondary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Zurück
            </a>
        </div>

        <div class="table-wrapper">
            <table class="styled-table">
                <thead>
                <tr>
                    <th style="width: 60px;">ID</th>
                    <th>Login</th>
                    <th>Email</th>
                    <th>Rollen</th>
                    <th>Status</th>
                    <th>Erstellt am</th>
                    <th class="text-end">Aktionen</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td class="text-muted" th:text="${user.id}">1</td>
                    <td>
                        <div style="display: flex; align-items: center; gap: 0.5rem; font-weight: 500;">
                            <div style="background: var(--bg-hover); padding: 4px; border-radius: 50%; color: var(--accent);">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4 0-7 2-7 4v2h14v-2c0-2-3-4-7-4z"/>
                                </svg>
                            </div>
                            <span th:text="${user.username}">User</span>
                        </div>
                    </td>
                    <td class="text-muted" th:text="${user.email}">email@test.de</td>
                    <td>
                        <span th:each="role : ${user.roles}"
                              class="role-tag"
                              th:text="${role}">
                        </span>
                    </td>
                    <td>
                        <span th:if="${user.active}" class="badge status-active">
                            <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
                            Aktiv
                        </span>
                        <span th:unless="${user.active}" class="badge status-inactive">
                            <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
                            Inaktiv
                        </span>
                    </td>
                    <td class="text-muted" th:text="${#temporals.format(user.createdAt, 'dd.MM.yyyy')}">01.01.2025</td>
                    <td class="text-end">
                        <a th:href="@{'/user/' + ${user.id}}" class="btn-action" title="Details anzeigen">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:replace="~{fragments/pagination :: render(${currentPage}, ${totalPages})}"></div>

    </div>
</section>
</html>
