<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">
<head>
    <title th:text="#{messages.inbox}">Posteingang</title>
</head>

<section layout:fragment="mybody">
    <div class="container" style="max-width: 900px; margin: 2rem auto; padding: 0 1rem;">

        <h1 class="text-main" style="margin-bottom: 2rem; font-weight: 700;" th:text="#{messages.inbox}">Posteingang</h1>

        <div th:if="${conversations.isEmpty()}" class="alert-info" style="padding: 2rem; text-align: center; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-muted);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-bottom: 1rem; opacity: 0.7;">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <p style="margin: 0;" th:text="#{messages.empty}">Keine Nachrichten vorhanden.</p>
        </div>

        <div class="chat-list" style="display: flex; flex-direction: column; gap: 0.75rem;">

            <a th:each="msg : ${conversations}"
               th:href="@{/messages/conversation/{partnerId}(partnerId=${msg.sender.id == currentUser.id ? msg.receiver.id : msg.sender.id})}"
               class="card-base"
               style="padding: 1.5rem; text-decoration: none; transition: all 0.2s; display: block; border: 1px solid var(--border-color); border-radius: 12px; background: var(--bg-card);">

                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <div style="display: flex; gap: 1rem; align-items: center;">
                        <div style="width: 48px; height: 48px; background: var(--bg-hover); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0;">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>

                        <div style="min-width: 0;">
                            <h3 style="margin: 0; font-size: 1.1rem; color: var(--text-main); font-weight: 600;"
                                th:text="${msg.sender.id == currentUser.id ? msg.receiver.username : msg.sender.username}">
                                Username
                            </h3>
                            <p style="margin: 0.25rem 0 0 0; color: var(--text-muted); font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"
                               th:text="${msg.sender.id == currentUser.id ? #messages.msg('messages.you') + ': ' + msg.content : msg.content}">
                              Vorschau...
                            </p>
                        </div>
                    </div>

                    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem;">
                        <span style="font-size: 0.85rem; color: var(--text-muted); white-space: nowrap;"
                              th:text="${#temporals.format(msg.sentAt, 'dd.MM. HH:mm')}">
                            12:00
                        </span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>
                </div>
            </a>
        </div>

        <div th:if="${totalPages > 1}" style="margin-top: 2rem;">
            <div th:replace="~{fragments/pagination :: render(${currentPage}, ${totalPages})}"></div>
        </div>

    </div>
</section>
</html>
