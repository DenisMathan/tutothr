<div th:fragment="course-card (course)">
        <div style="cursor: pointer;" class="card shadow-sm" th:onclick="|window.location.href='/courses/${course.id}'|">
            <div class="card-body">
                <h3 class="card-title mb-2" th:text="${course.title}">Kursname</h3>
                <p class="card-text" th:text="${course.description}">Kursbeschreibung</p>
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <span class="fw-bold">Preis: <span
                            th:text="${#numbers.formatDecimal(course.price, 1, 'COMMA', 2, 'POINT')}">49,99</span>
                        €</span>
                    <span class="badge bg-success">★ <span th:text="${course.rating}">4.5</span></span>
                </div>
                <button class="btn btn-primary mt-4 w-4"
                th:onclick="|assignCourse(event, ${course.id})|">Assign</button>
                <button class="btn btn-primary mt-4 w-4"
                th:onclick="|event.stopPropagation(); window.location.href='/tutor/courses/update/${course.id}'|">Edit</button>
            </div>
        </div>
</div>
