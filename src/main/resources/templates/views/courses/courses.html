<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      layout:decorate="~{layout}">

<head>
  <title th:text="#{courses.title}">Kurse</title>
</head>

<section layout:fragment="mybody">

  <!-- Hinweis bei verweigertem Zugriff auf Datei -->
  <div th:if="${accessDenied}" class="alert-warning" style="background: var(--status-warning-bg, #fef3c7); border: 1px solid var(--status-warning, #f59e0b); color: var(--status-warning-text, #92400e); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.75rem;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
      </svg>
      <span th:text="#{chapter.access.denied}">Dieser Inhalt ist kostenpflichtig.</span>
  </div>

  <div class="container" style="max-width: 1200px; margin: 2rem auto; padding: 0 1rem;">

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h1 class="text-main" style="margin: 0; font-weight: 700;" th:text="#{courses.title}">Kurse</h1>
      <a th:href="@{/tutor/courses/add}" class="btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        <span th:text="#{courses.create}">Neuer Kurs</span>
      </a>
    </div>

    <div class="card-base form-wrapper" style="margin-bottom: 2rem;">

      <form th:action="@{/courses}" method="get" th:object="${searchDTO}">

        <div class="search-grid">

          <div class="search-full-width" style="grid-column: span 2;">
            <label class="form-label" th:text="#{common.search}">Suchbegriff</label>
            <div style="position: relative;">
              <input type="text"
                     class="form-input"
                     th:field="*{text}"
                     th:placeholder="#{courses.search.placeholder}"
                     style="padding-left: 2.5rem;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </div>
          </div>

          <div>
            <label class="form-label" th:text="#{courses.filter.tutor}">Tutor</label>
            <input type="text" class="form-input" th:field="*{tutorName}" th:placeholder="#{common.name} + '...'">
          </div>

          <div>
            <label class="form-label" th:text="#{courses.filter.category}">Kategorien</label>
            <details class="custom-dropdown">
              <summary class="form-input" th:text="#{common.select}">Wählen...</summary>
              <div class="dropdown-content">
                <div th:each="cat : ${categories}" class="checkbox-list-item">
                  <input type="checkbox"
                         class="form-check-input"
                         th:field="*{categoryIds}"
                         th:value="${cat.id}"
                         th:id="${'cat-' + cat.id}">
                  <label class="checkbox-label" th:for="${'cat-' + cat.id}" th:text="${cat.title}">Kategorie</label>
                </div>
              </div>
            </details>
          </div>

          <div>
            <label class="form-label" th:text="#{courses.filter.price.max}">Max. Preis (€)</label>
            <input type="number" class="form-input" th:field="*{maxPrice}" step="1" min="0" placeholder="z.B. 50">
          </div>

          <div>
            <label class="form-label" th:text="#{courses.filter.rating}">Mind. Bewertung</label>
            <select class="form-input" th:field="*{minRating}">
              <option value="" th:text="#{common.all}">Alle</option>
              <option value="3">★★★ &amp; besser</option>
              <option value="4">★★★★ &amp; besser</option>
              <option value="5">★★★★★</option>
            </select>
          </div>

          <div>
            <label class="form-label" th:text="#{courses.sort.by}">Sortierung</label>
            <select class="form-input" th:field="*{sortBy}">
              <option value="CREATED_AT" th:text="#{courses.sort.newest}">Neueste</option>
              <option value="PRICE" th:text="#{common.price}">Preis</option>
              <option value="RATING" th:text="#{courses.filter.rating}">Beliebtheit</option>
              <option value="TITLE" th:text="#{courses.sort.alpha}">Alphabetisch</option>
            </select>
          </div>

          <div>
            <label class="form-label" th:text="#{courses.sort.direction}">Richtung</label>
            <select class="form-input" th:field="*{sortDirection}">
              <option value="DESC" th:text="#{courses.sort.desc}">Absteigend</option>
              <option value="ASC" th:text="#{courses.sort.asc}">Aufsteigend</option>
            </select>
          </div>

        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">

          <div class="form-check" style="display: flex; align-items: center; gap: 0.5rem;">
            <input type="checkbox" class="form-check-input" th:field="*{onlyAvailable}" id="onlyAvailable">
            <label class="form-label" for="onlyAvailable" style="margin: 0; cursor: pointer;" th:text="#{courses.filter.available}">
              Nur Kurse mit freien Terminen
            </label>
          </div>

          <div style="display: flex; gap: 1rem;">
            <a th:href="@{/courses}" class="btn-secondary" th:text="#{common.reset}">Reset</a>
            <button type="submit" class="btn-primary" th:text="#{common.filter}">Filter anwenden</button>
          </div>
        </div>

        <input type="hidden" name="page" value="0">
      </form>
    </div>

    <div class="mb-3" th:if="${totalItems != null}">
      <span class="text-muted" th:text="${totalItems} + ' ' + #{courses.found}"></span>
    </div>

    <div th:if="${#lists.isEmpty(courses)}" class="alert-info" style="margin-top: 2rem; display: flex; align-items: center; gap: 0.5rem; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted); padding: 1rem; border-radius: 8px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span th:text="#{courses.no.results}">Keine Kurse gefunden.</span>
    </div>

    <div class="courses-grid" th:if="${!#lists.isEmpty(courses)}">
      <th:block th:each="course : ${courses}">
        <div th:replace="~{fragments/courses/course-card :: course-card(${course})}"></div>
      </th:block>
    </div>

    <div th:if="${totalPages > 1}" style="margin-top: 2rem;">
      <div th:replace="~{fragments/pagination :: render(${currentPage}, ${totalPages})}"></div>
    </div>

  </div>

  <script type="text/javascript">
    document.addEventListener('click', function(e) {
      const dropdowns = document.querySelectorAll('.custom-dropdown');
      dropdowns.forEach(details => {
        if (!details.contains(e.target)) {
          details.removeAttribute('open');
        }
      });
    });
  </script>
</section>
</html>
