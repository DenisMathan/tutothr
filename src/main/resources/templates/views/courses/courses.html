<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">

<head>
    <title>Kurse</title>
</head>


<section layout:fragment="mybody">
    <div class="courses-container">
        <div class="courses-header">
            <h1 class="courses-title">Kurse</h1>
            <a th:href="@{/tutor/courses/add}" class="btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                Neuer Kurs
            </a>

        </div>

        <!-- Falls keine Kurse vorhanden sind -->
        <div th:if="${#lists.isEmpty(courses)}" class="alert-info">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
            Es sind keine Kurse vorhanden.
        </div>

        <!-- Kurskarten-Ansicht -->
        <div class="row" th:if="${!#lists.isEmpty(courses)}">
            <div class="mb-4" th:each="course : ${courses}">
                <!-- <div th:replace="~{views/courses/course-card :: course-card (~{::course=${course}})}"></div> -->
                <div th:replace="~{fragments/courses/course-card :: course-card(${course})}"></div>
            </div>
        </div>
    </div>
    <script type="text/javascript">
        function assignCourse(event, courseId) {
            event.stopPropagation();
            event.preventDefault();
            console.log("Assigning course with ID:", courseId);
            // Hier können Sie AJAX-Aufrufe oder andere Logik hinzufügen, um den Kurs zuzuweisen
        }
    </script>
</section>
</html>
