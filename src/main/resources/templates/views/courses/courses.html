<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">

<head>
    <title>Kurse</title>
</head>

<section layout:fragment="mybody">
    <div class="courses-container">
        <div class="courses-header">
            <h1 class="courses-title">Kurse</h1>
            <a th:href="@{/courses/new}" class="btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                Neuer Kurs
            </a>
        </div>

        <!-- Falls keine Kurse vorhanden sind -->
        <div th:if="${#lists.isEmpty(courses)}" class="alert-info">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
            Es sind keine Kurse vorhanden.
        </div>

        <!-- Liste der Kurse -->
        <div th:if="${!#lists.isEmpty(courses)}" class="courses-table-wrapper">
            <table class="courses-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Beschreibung</th>
                    <th>Kategorien</th>
                    <th class="text-end">Aktionen</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="course : ${courses}">
                    <td th:text="${course.id}">1</td>
                    <td th:text="${course.title}">Beispiel</td>
                    <td th:text="${course.description}">Beschreibung</td>
                    <td>
                            <span class="category-tags">
                                <span th:each="category, iter : ${course.categories}"
                                      class="category-tag"
                                      th:text="${category.title}">
                                </span>
                            </span>
                    </td>
                    <td class="text-end">
                        <div class="action-buttons">
                            <a th:href="@{/courses/{id}(id=${course.id})}"
                               class="btn-action btn-view"
                               title="Ansehen">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </a>
                            <a th:href="@{/courses/{id}/edit(id=${course.id})}"
                               class="btn-action btn-edit"
                               title="Bearbeiten">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                </svg>
                            </a>
                            <form th:action="@{/courses/{id}(id=${course.id})}"
                                  method="post"
                                  th:object="${course}"
                                  style="display:inline;">
                                <input type="hidden" name="_method" value="delete" />
                                <button type="submit"
                                        class="btn-action btn-delete"
                                        title="Löschen"
                                        onclick="return confirm('Kurs wirklich löschen?');">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                    </svg>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>

</html>
