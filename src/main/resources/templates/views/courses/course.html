<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">

<head>
    <title th:text="${course.title}">Kurs Details</title>
</head>

<section layout:fragment="mybody">
    <div class="course-detail-container">
        <div class="course-detail-header">
            <a th:href="@{/courses}" class="btn-secondary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Zurück zur Übersicht
            </a>
        </div>

        <div class="course-card">
            <div class="course-card-header">
                <div style="flex: 1;">
                    <h1 class="course-title" th:text="${course.title}">Kurs Titel</h1>

                    <div class="course-rating">
                        <div class="stars">
                            <svg th:each="i : ${#numbers.sequence(1, 5)}" width="20" height="20" viewBox="0 0 24 24"
                                 th:classappend="${i <= avgRating} ? 'star-filled' : 'star-empty'">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                            </svg>
                        </div>
                        <span class="rating-value" th:text="${#numbers.formatDecimal(avgRating, 1, 1)}">4.5</span>
                        <span class="rating-count" th:text="'(' + ${#lists.size(course.ratings)} + ' Bewertungen)'">(12)</span>
                    </div>
                </div>

                <div class="course-price">
                    <span class="price-label">Preis</span>
                    <span class="price-value" th:text="${#numbers.formatDecimal(course.price, 1, 2)} + ' €'">49.99 €</span>
                </div>
            </div>

            <div class="course-actions-row" th:if="${!course.isOwner}">
                <a th:href="@{/course/{id}/book(id=${course.id})}" class="btn-primary">
                    Buchen
                </a>
                <a th:href="@{/courses/{id}/addRating(id=${course.id})}" class="btn-secondary">
                    Bewertung schreiben
                </a>
                <a th:href="@{/messages/new(recipientId=${course.ownerId},courseId=${course.id})}" class="btn-secondary">
                    Kontaktieren
                </a>
                <button th:onclick="'openReportModal(\'COURSE\', ' + ${course.id} + ')'"
                        type="button"
                        class="report-button"
                        style="background: none; border: none; color: #ef4444; cursor: pointer"
                        title="Melden">
                    Melden
                </button>
            </div>

            <div class="course-section">
                <h2 class="section-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                    Beschreibung
                </h2>
                <p class="course-description" th:text="${course.description}"></p>
            </div>

            <div class="course-section" th:if="${!#lists.isEmpty(course.categories)}">
                <h2 class="section-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                        <polyline points="22 4 12 14.01 9 11.01" />
                    </svg>
                    Kategorien
                </h2>
                <div class="category-tags">
                    <span th:each="category : ${course.categories}" class="category-tag" th:text="${category.title}"></span>
                </div>
            </div>
            
            <!-- HASHTAGS -->
            <div class="course-section" 
              th:if="${!#lists.isEmpty(course.hashtags)} or ${#authorization.expression('isAuthenticated()')}">
                <h2 class="section-title">
                  <svg width="20" 
                    height="20" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    stroke-width="2">
                      <path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/>
                  </svg>
                  Hashtags
                </h2>
                <div class="d-flex flex-wrap align-items-center gap-1">
                  <!-- Bestehende Hashtags -->
                  <div th:each="tag : ${course.hashtags}" class="d-inline-flex align-items-center me-1">
                    <a th:href="@{/courses(hashtag=${tag.name})}" 
                      class="badge rounded-pill bg-secondary text-decoration-none">
                        #<span th:text="${tag.name}"></span>
                    </a>
                    <!-- Entfernen-Button (nur für Berechtigte) -->
                    <form th:if="${course.isOwner or #authorization.expression('hasRole(''ADMIN'')')}" 
                      th:action="@{/courses/{courseId}/hashtags/{hashtagId}(courseId=${course.id}, hashtagId=${tag.id})}" 
                      method="post" 
                      class="d-inline ms-1">
                        <input type="hidden" name="_method" value="delete"/>
                        <button type="submit" 
                          class="btn btn-link btn-sm p-0 text-danger" 
                          style="font-size: 0.8rem; line-height: 1;"
                          title="Hashtag entfernen"
                          onclick="return confirm('Hashtag entfernen?');">
                            ×
                        </button>
                    </form>
                  </div>

                  <!-- Hinzufuegen-Button (für eingeloggte User) -->
                  <div th:if="${#authorization.expression('isAuthenticated()')}">
                    <button type="button" 
                      class="badge rounded-pill bg-primary text-decoration-none border-0"
                      onclick="document.getElementById('hashtag-input').classList.toggle('d-none');"
                      title="Hashtag hinzufügen">
                        +
                    </button>
                  </div>
                </div>

                <!-- Inline-Eingabefeld (versteckt) -->
                <div id="hashtag-input" class="d-none mt-2">
                  <form th:action="@{/courses/{id}/hashtags(id=${course.id})}" method="post" class="d-flex gap-2">
                    <input type="text" 
                      name="hashtags" 
                      class="form-control form-control-sm" 
                      placeholder="Statistik, Mathe, Klausur"
                      style="max-width: 300px;"/>
                    <button type="submit" class="btn btn-sm btn-primary">Hinzufügen</button>
                    <button type="button" 
                      class="btn btn-sm btn-secondary"
                      onclick="document.getElementById('hashtag-input').classList.add('d-none');">
                        Abbrechen
                    </button>
                  </form>
                  <small class="text-muted">Mehrere Hashtags mit Komma trennen</small>
                </div>
            </div>

            <div class="course-section is-last">
                <h2 class="section-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                    Kursinhalte
                </h2>
                <div class="chapter-list">
                    <div th:each="chapter : ${course.chapters}" class="chapter-item">
                        <button th:replace="~{fragments/courses/chapter/chapter :: chapter(${chapter}, ${course.isOwner})}"></button>
                    </div>
                    <div th:if="${course.isOwner}" style="margin-top: 1rem;">
                        <script>
                            function toggleAdd() {
                                document.getElementById('add-chapter').classList.toggle('hidden');
                            }
                        </script>
                        <div th:replace="fragments/buttons/roundButton :: roundButton('https://img.icons8.com/?size=100&id=1501&format=png&color=7c3aed', 'toggleAdd()')"></div>
                        <div id="add-chapter" class="hidden" style="margin-top: 1rem;">
                            <div style="background: var(--bg-input); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border-color);">
                                <div th:replace="fragments/forms/form :: form(object=${course.addChapter}, action=@{/tutor/chapters/save})"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="course-actions" th:if="${course.isOwner}">
                <a th:href="@{/courses/{id}/edit(id=${course.id})}" class="btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                    </svg>
                    Kurs bearbeiten
                </a>
                <form th:action="@{/courses/{id}(id=${course.id})}" method="post" style="display:inline;">
                    <input type="hidden" name="_method" value="delete" />
                    <button type="submit" class="btn-danger" onclick="return confirm('Kurs wirklich löschen?');">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        </svg>
                        Kurs löschen
                    </button>
                </form>
            </div>
        </div>

        <div class="ratings-section" th:if="${!#lists.isEmpty(course.ratings)}">
            <h2 class="ratings-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                </svg>
                Bewertungen
            </h2>
            <div class="ratings-list">
                <div th:each="rating : ${course.ratings}" class="rating-card">
                    <div class="rating-header">
                        <div class="rating-author">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4 0-7 2-7 4v2h14v-2c0-2-3-4-7-4z" />
                            </svg>
                            <span th:text="${rating.author.username}">Username</span>
                        </div>
                        <div class="rating-stars-small">
                            <svg th:each="i : ${#numbers.sequence(1, 5)}" width="14" height="14" viewBox="0 0 24 24"
                                 th:classappend="${i <= rating.stars} ? 'star-filled' : 'star-empty'">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
                            </svg>
                        </div>
                    </div>
                    <p class="rating-comment" th:if="${rating.comment}" th:text="${rating.comment}"></p>
                    <span class="rating-date" th:if="${rating.createdAt}" th:text="${#temporals.format(rating.createdAt, 'dd.MM.yyyy')}"></span>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/report-modal :: reportModal}"></div>
</section>
</html>
