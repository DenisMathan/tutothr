<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">

<head>
    <title>Bewertung hinzufügen</title>
</head>

<section layout:fragment="mybody">
    <div class="container" style="max-width: 600px; margin: 2rem auto; padding: 0 1rem;">

        <div style="margin-bottom: 2rem;">
            <h2 class="text-main" style="margin-bottom: 0.5rem; font-weight: 700;">Bewertung abgeben</h2>
            <p class="text-muted" th:if="${course}" style="margin: 0;">
                Kurs: <strong style="color: var(--text-main);" th:text="${course.title}">Kurs Titel</strong>
            </p>
        </div>

        <form th:action="@{/courses/{id}/addRating(id=${course.id})}"
              th:object="${rating}"
              method="post"
              class="card-base form-wrapper">

            <div style="margin-bottom: 2rem;">
                <label class="form-label" style="display: flex; align-items: center; gap: 0.5rem;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="color: #fbbf24;">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                    </svg>
                    Deine Bewertung
                </label>

                <div class="star-rating-input">
                    <input type="radio" id="star5" th:field="*{stars}" value="5" required />
                    <label for="star5" title="5 Sterne">
                        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    </label>

                    <input type="radio" id="star4" th:field="*{stars}" value="4" />
                    <label for="star4" title="4 Sterne">
                        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    </label>

                    <input type="radio" id="star3" th:field="*{stars}" value="3" />
                    <label for="star3" title="3 Sterne">
                        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    </label>

                    <input type="radio" id="star2" th:field="*{stars}" value="2" />
                    <label for="star2" title="2 Sterne">
                        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    </label>

                    <input type="radio" id="star1" th:field="*{stars}" value="1" />
                    <label for="star1" title="1 Stern">
                        <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    </label>
                </div>

                <p class="text-muted" style="font-size: 0.85rem; margin-top: 0.5rem;">Klicke auf einen Stern</p>
                <div th:if="${#fields.hasErrors('stars')}" th:errors="*{stars}" style="color: #ef4444; font-size: 0.85rem; margin-top: 0.5rem;">Error</div>
            </div>

            <div style="margin-bottom: 1.5rem;">
                <label for="comment" class="form-label">Kommentar (optional)</label>
                <textarea id="comment"
                          th:field="*{comment}"
                          class="form-textarea"
                          rows="4"
                          placeholder="Was hat dir an diesem Kurs gefallen?"></textarea>
                <div th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}" style="color: #ef4444; font-size: 0.85rem; margin-top: 0.5rem;">Error</div>
            </div>

            <div style="display: flex; gap: 1rem; justify-content: flex-end; padding-top: 1rem; border-top: 1px solid var(--border-color);">
                <a th:href="@{/courses/{id}(id=${course.id})}" class="btn-secondary">
                    Abbrechen
                </a>
                <button type="submit" class="btn-primary">
                    Bewertung speichern
                </button>
            </div>
        </form>
    </div>
</section>
</html>
