<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>E-Mail Verifizierung</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card-verify {
            max-width: 500px;
            margin-top: 100px;
            border: none;
        }
        .icon-box {
            color: #0d6efd;
            font-size: 4rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center">
        <div class="card card-verify shadow-sm p-4 text-center">
            <div class="card-body">
                <!-- Brief-Icon (SVG) -->
                <div class="icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-envelope-check" viewBox="0 0 16 16">
                        <path d="M2 2a2 2 0 0 0-2 2v8.01A2 2 0 0 0 2 14h5.5a.5.5 0 0 0 0-1H2a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3.79a.5.5 0 0 1-1 0V5a2 2 0 0 0-2-2H2Zm13.854 8.354a.5.5 0 1 1 .708.708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L12.5 13.293l2.354-2.353Z"/>
                    </svg>
                </div>

                <h3 class="card-title mb-3">Verifiziere deine E-Mail</h3>
                
                <p class="text-muted" th:text="${info.message}">
                    Wir haben einen Bestätigungslink an 
                    <strong><span th:text="${user.email}">deine@email.com</span></strong> 
                    gesendet.
                </p>
                <p class="mb-4">
                    Bitte überprüfe deinen Posteingang (und Spam-Ordner) und klicke auf den Link, um deinen Account zu aktivieren.
                </p>

                <hr>

                <p class="small text-muted">Keine E-Mail erhalten?</p>
                <p th:if="${!info.resendUrl}" class="small text-muted">Nach 10 min kannst du die E-Mail erneut anfordern.</p>
                
                <!-- Formular zum erneuten Senden -->
                <form th:if="${info.resendUrl}" th:action="@{/verify/resend-mail}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" name="userId" th:value="${info.userId}" />
                    <button type="submit" class="btn btn-outline-primary btn-sm">E-Mail erneut senden</button>
                </form>

                <div class="mt-4">
                    <a th:href="@{/login}" class="text-decoration-none text-muted small">Zurück zum Login</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
