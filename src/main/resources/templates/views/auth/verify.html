<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">

<head>
    <title th:text="#{verify.title}">E-Mail Verifizierung</title>
</head>

<body>
<section layout:fragment="mybody" class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="container" style="max-width: 500px;">
        <div class="course-card" style="padding: 0; overflow: hidden; border: 1px solid var(--border-color); background: var(--bg-card); border-radius: 16px;">
            
            <div style="background: var(--bg-hover); padding: 2rem; text-align: center; border-bottom: 1px solid var(--border-color);">
                <div style="color: var(--accent); margin-bottom: 1rem;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-envelope-check" viewBox="0 0 16 16">
                        <path d="M2 2a2 2 0 0 0-2 2v8.01A2 2 0 0 0 2 14h5.5a.5.5 0 0 0 0-1H2a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3.79a.5.5 0 0 1-1 0V5a2 2 0 0 0-2-2H2Zm13.854 8.354a.5.5 0 1 1 .708.708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L12.5 13.293l2.354-2.353Z"/>
                    </svg>
                </div>
                <h2 style="margin: 0; color: var(--text-main); font-weight: 700;" th:text="#{verify.title}">Verifiziere deine E-Mail</h2>
            </div>

            <div style="padding: 2rem; text-align: center;">
                <p style="color: var(--text-muted);" th:text="${info.message}">
                    Wir haben einen Bestätigungslink gesendet.
                </p>
                <p style="margin-bottom: 1.5rem; color: var(--text-main);" th:text="#{verify.check.inbox}">
                    Bitte überprüfe deinen Posteingang und klicke auf den Link.
                </p>

                <div style="border-top: 1px solid var(--border-color); margin: 1.5rem 0;"></div>

                <p class="small" style="color: var(--text-muted);" th:text="#{verify.no.email}">Keine E-Mail erhalten?</p>
                
                <form th:if="${info.resendUrl}" th:action="@{/verify/resend-mail}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" name="userId" th:value="${info.userId}" />
                    <button type="submit" class="btn btn-outline-primary btn-sm" th:text="#{verify.resend}">E-Mail erneut senden</button>
                </form>

                <div class="mt-4">
                    <a th:href="@{/login}" style="color: var(--accent); text-decoration: none; font-weight: 600; font-size: 0.9rem;" th:text="#{verify.back.login}">Zurück zum Login</a>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
