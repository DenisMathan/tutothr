<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head>
    <title>Login</title>
    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="/webjars/open-iconic/font/css/open-iconic-bootstrap.min.css" rel="stylesheet" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <!-- <link href="/css/style.css" rel="stylesheet" /> -->
    <style>
        .card-register {
            max-width: 520px;
            margin-top: 60px;
        }

        .pw-note {
            font-size: .9rem;
            color: #6c757d;
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center">
        <div class="card card-register shadow-sm bg-body rounded" style="width: 100%; padding: 2rem;">
            <div class="card-body">
                <h3 class="card-title mb-3">Login</h3>

                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                    Ungültiger Benutzername oder Passwort.
                </div>
                <div th:if="${param.logout}" class="alert alert-success" role="alert">
                    Du wurdest erfolgreich abgemeldet.
                </div>
                <div th:replace="~{fragments/forms/form :: form(object=${loginForm}, action=@{/login})}"></div>
                <hr />
                <div>
                    <a th:href="@{/oauth2/authorization/google}"
                        style="height: 2rem; width: 2rem; border-radius: 100%;">
                        <img style="height: 2rem; width: 2rem;"
                            src="https://img.icons8.com/?size=100&id=17949&format=png&color=000000" />
                    </a>
                    <p class="small">Kein Konto? <a th:href="@{/register}">Registrieren</a></p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
