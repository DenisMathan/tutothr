<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">

<head>
    <title th:text="#{login.title}">Login</title>
</head>

<section layout:fragment="mybody" class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="container" style="max-width: 500px;">
        <!-- Card im Style des User-Profils -->
        <div class="course-card" style="padding: 0; overflow: hidden; border: 1px solid var(--border-color); background: var(--bg-card); border-radius: 16px;">
            
            <!-- Header -->
            <div style="background: var(--bg-hover); padding: 2rem; text-align: center; border-bottom: 1px solid var(--border-color);">
                <h2 style="margin: 0; color: var(--text-main); font-weight: 700;" th:text="#{login.welcome}">Willkommen zurück</h2>
                <p style="margin: 0.5rem 0 0; color: var(--text-muted);" th:text="#{login.subtitle}">Bitte logge dich in deinen Account ein</p>
            </div>

            <!-- Body -->
            <div style="padding: 2rem;">
                <!-- Error Alert -->
                <div th:if="${param.error}" class="alert alert-danger" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #ef4444; border-radius: 8px; font-size: 0.9rem;" role="alert">
                    <span th:text="#{login.error}">Ungültiger Benutzername oder Passwort.</span>
                </div>
                <div th:if="${param.locked}" class="alert alert-danger" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #ef4444; border-radius: 8px; font-size: 0.9rem;" role="alert">
                    Dein Konto ist gesperrt. Bitte kontaktiere den Support für weitere Informationen.
                </div>
                
                <!-- Logout Alert -->
                <div th:if="${param.logout}" class="alert alert-success" style="background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); color: #10b981; border-radius: 8px; font-size: 0.9rem;" role="alert">
                    <span th:text="#{login.logout.success}">Du wurdest erfolgreich abgemeldet.</span>
                </div>

                <div th:replace="~{fragments/forms/form :: form(object=${loginForm}, action=@{/login})}"></div>

                <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); text-align: center;">
                    <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2" 
                       style="border-color: var(--border-color); color: var(--text-main); background: var(--bg-body);">
                        <img style="height: 1.25rem; width: 1.25rem;" src="https://img.icons8.com/?size=100&id=17949&format=png&color=000000" />
                        <span th:text="#{login.google}">Mit Google fortfahren</span>
                    </a>
                    
                    <p class="small mt-3 mb-0" style="color: var(--text-muted);">
                        <span th:text="#{login.no.account}">Noch kein Konto?</span> <a th:href="@{/register}" style="color: var(--accent); text-decoration: none; font-weight: 600;" th:text="#{login.register.link}">Jetzt registrieren</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>

</html>
