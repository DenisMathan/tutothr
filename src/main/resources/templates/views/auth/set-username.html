<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Registrierung</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <style>
        .card-register {
            max-width: 520px;
            margin-top: 60px;
        }

        .pw-note {
            font-size: .9rem;
            color: #6c757d;
        }
    </style>
</head>

<body>

    <div class="container" style="margin-top: 60px;">
        <div class="card">
            <div class="card-body">
                <h1>Willkommen bei Tutothr</h1>
                <h4>Ein letzter Schritt!</h4>
                <h4>Wie sollen wir dich nennen? :)</h4>
                <form th:action="@{/set-username}" method="post" th:object="${user}">
                    <div>
                        <input type="hidden" name="${_csrf.parameterName}" value="${_csrf.token}" />
                        <input type="hidden" name="_method" value="put" />
                        <input type="hidden" th:field="*{id}" />
                        <input type="text" th:field="*{username}" placeholder="Enter your username" required />
                    </div>
                    <button id="submit-username" type="submit" class="btn btn-primary mt-3">Speichern</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
