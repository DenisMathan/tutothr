<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">

<head>
    <title th:text="#{setusername.title}">Benutzernamen wählen</title>
</head>

<section layout:fragment="mybody" class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="container" style="max-width: 500px;">
        <div class="course-card" style="padding: 0; overflow: hidden; border: 1px solid var(--border-color); background: var(--bg-card); border-radius: 16px;">
            
            <!-- Header -->
            <div style="background: var(--bg-hover); padding: 2rem; text-align: center; border-bottom: 1px solid var(--border-color);">
                <h2 style="margin: 0; color: var(--text-main); font-weight: 700;" th:text="#{setusername.title}">Fast geschafft!</h2>
                <p style="margin: 0.5rem 0 0; color: var(--text-muted);" th:text="#{setusername.subtitle}">Bitte wähle einen Benutzernamen.</p>
            </div>

            <!-- Body -->
            <div style="padding: 2rem;">
                <form th:action="@{/set-username}" method="post" th:object="${user}">
                    
                    <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" name="_method" value="put" />
                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-4">
                        <label for="username" style="display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; font-weight: 500;" th:text="#{profile.username}">Benutzername</label>
                        <input type="text" 
                               id="username"
                               th:field="*{username}" 
                               class="form-input w-100" 
                               placeholder="@DeinName" 
                               required 
                               autofocus
                               style="background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.75rem 1rem; border-radius: 8px; width: 100%; transition: all 0.2s;" />
                    </div>

                    <button id="submit-username" type="submit" class="btn-primary w-100" style="justify-content: center; height: 48px; font-size: 1rem; font-weight: 600;" th:text="#{common.save}">
                        Konto erstellen & loslegen
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>

</html>
