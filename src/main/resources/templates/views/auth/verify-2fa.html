<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head>
    <title th:text="#{verify.2fa.title}">2FA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .card-register { max-width: 520px; margin-top: 60px; }
        .pw-note { font-size: .9rem; color: #6c757d; }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center">
        <div class="card card-register shadow-sm bg-body rounded" style="width: 100%; padding: 2rem;">
            <div class="card-body">
                <h3 class="card-title mb-3" th:text="#{verify.2fa.title}">Zwei-Faktor-Authentifizierung</h3>
                <form th:action="@{/login/verify-2fa-check}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label for="code" class="form-label" th:text="#{verify.2fa.code}">Authentifizierungs-Code</label>
                        <input id="code" name="code" type="text" class="form-control" required autofocus />
                        <div class="form-text pw-note" th:text="#{verify.2fa.subtitle}">
                            Bitte gib den Code ein, der dir per E-Mail zugesendet wurde.
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary" th:text="#{verify.2fa.submit}">Verifizieren</button>
                    </div>
                </form>
                <hr />
            </div>
        </div>
    </div>
</body>

</html>
