<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head>
    <title>Login</title>
    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="/webjars/open-iconic/font/css/open-iconic-bootstrap.min.css" rel="stylesheet" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <!-- <link href="/css/style.css" rel="stylesheet" /> -->
    <style>
        .card-register {
            max-width: 520px;
            margin-top: 60px;
        }

        .pw-note {
            font-size: .9rem;
            color: #6c757d;
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center">
        <div class="card card-register shadow-sm bg-body rounded" style="width: 100%; padding: 2rem;">
            <div class="card-body">
                <h3 class="card-title mb-3">Zwei-Faktor-Authentifizierung</h3>
                <form th:action="@{/login/verify-2fa-check}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label for="code" class="form-label">Authentifizierungs-Code</label>
                        <input id="code" name="code" type="text" class="form-control" required autofocus />
                        <div class="form-text pw-note">
                            Bitte gib den Code ein, der dir per E-Mail zugesendet wurde.
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Verifizieren</button>
                    </div>
                </form>
                <hr />
            </div>
        </div>
    </div>
</body>

</html>
