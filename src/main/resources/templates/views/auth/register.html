<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">

<head>
    <title th:text="#{register.title}">Registrierung</title>
</head>

<section layout:fragment="mybody" class="d-flex align-items-center justify-content-center" style="min-height: 80vh; padding: 2rem 0;">
    <div class="container" style="max-width: 550px;">
        <div class="course-card" style="padding: 0; overflow: hidden; border: 1px solid var(--border-color); background: var(--bg-card); border-radius: 16px;">
            
            <!-- Header -->
            <div style="background: var(--bg-hover); padding: 2rem; text-align: center; border-bottom: 1px solid var(--border-color);">
                <h2 style="margin: 0; color: var(--text-main); font-weight: 700;" th:text="#{register.welcome}">Neues Konto erstellen</h2>
                <p style="margin: 0.5rem 0 0; color: var(--text-muted);" th:text="#{register.subtitle}">Werde Teil der TutoHR Community</p>
            </div>

            <!-- Body -->
            <div style="padding: 2rem;">
                <div th:replace="~{fragments/forms/form :: form(object=${registrationForm}, action=@{/register})}"></div>

                <!-- Google Auth & Login Link -->
                <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); text-align: center;">
                     <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2" 
                       style="border-color: var(--border-color); color: var(--text-main); background: var(--bg-body);">
                        <img style="height: 1.25rem; width: 1.25rem;" src="https://img.icons8.com/?size=100&id=17949&format=png&color=000000" />
                        <span th:text="#{login.google}">Mit Google registrieren</span>
                    </a>

                    <p class="small mt-3 mb-0" style="color: var(--text-muted);">
                        <span th:text="#{register.have.account}">Schon ein Konto?</span> <a th:href="@{/login}" style="color: var(--accent); text-decoration: none; font-weight: 600;" th:text="#{register.login.link}">Jetzt anmelden</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>

</html>
