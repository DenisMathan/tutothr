<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Registrierung</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <style>
        .card-register {
            max-width: 520px;
            margin-top: 60px;
        }

        .pw-note {
            font-size: .9rem;
            color: #6c757d;
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center">
        <div class="card card-register shadow-sm bg-body rounded" style="width: 100%; padding: 2rem;">
            <div class="card-body">
                <h3 class="card-title mb-3">Neues Konto erstellen</h3>
                <div th:replace="~{fragments/forms/form :: form(object=${registrationForm}, action=@{/register})}">
                </div>
                <hr />
                <a th:href="@{/oauth2/authorization/google}" style="height: 2rem; width: 2rem; border-radius: 100%;">
                    <img style="height: 2rem; width: 2rem;"
                        src="https://img.icons8.com/?size=100&id=17949&format=png&color=000000" />
                </a>
                <p class="small mb-0">
                    Schon ein Konto? <a th:href="@{/login}">Anmelden</a>
                </p>
            </div>
        </div>
    </div>
</body>

</html>
