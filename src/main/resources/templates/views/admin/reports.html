<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">
<head><title>Moderation</title></head>
<section layout:fragment="mybody">
    <div class="container" style="max-width: 1400px; margin: 0 auto; padding: 2rem 1rem;">

        <div th:if="${pendingCount > 0}" style="display: grid; gap: 1.5rem;">
            <div th:each="report : ${reports}" class="report-card" style="background: #0b1220; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 1.5rem;">

                <div style="display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 1rem; margin-bottom: 1rem;">
                    <div>
                        <div style="color: #e6eef8; font-weight: 600;">Von <span th:text="${report.reporterUsername}">User</span></div>
                        <div style="color: #9aa4b2; font-size: 0.8rem;" th:text="${#temporals.format(report.reportedAt, 'dd.MM.yyyy HH:mm')}">Datum</div>
                    </div>

                    <div th:switch="${report.type}">
                        <span th:case="'MESSAGE'" style="background: rgba(59, 130, 246, 0.1); color: #3b82f6; padding: 0.3rem 0.8rem; border-radius: 6px; font-size: 0.8rem; border: 1px solid rgba(59, 130, 246, 0.2);">Nachricht</span>
                        <span th:case="'COURSE'"  style="background: rgba(16, 185, 129, 0.1); color: #10b981; padding: 0.3rem 0.8rem; border-radius: 6px; font-size: 0.8rem; border: 1px solid rgba(16, 185, 129, 0.2);">Kurs</span>
                        <span th:case="'CHAPTER'" style="background: rgba(236, 72, 153, 0.1); color: #ec4899; padding: 0.3rem 0.8rem; border-radius: 6px; font-size: 0.8rem; border: 1px solid rgba(236, 72, 153, 0.2);">Kapitel</span>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                    <div style="background: rgba(124, 58, 237, 0.05); padding: 1rem; border-radius: 8px;">
                        <div style="text-transform: uppercase; font-size: 0.7rem; color: #9aa4b2; margin-bottom: 0.5rem;">Beschuldigter</div>
                        <div style="color: #e6eef8; font-weight: bold;" th:text="${report.offenderUsername}">User</div>
                        <div style="font-size: 0.8rem;" th:text="'Strikes: ' + ${report.offenderStrikes}">Strikes: 0</div>
                    </div>

                    <div style="background: rgba(255,255,255,0.02); padding: 1rem; border-radius: 8px;">
                        <div style="text-transform: uppercase; font-size: 0.7rem; color: #9aa4b2; margin-bottom: 0.5rem;">
                            <span th:text="${report.contextInfo}">Inhalt</span>
                        </div>
                        <div style="color: #e6eef8; font-style: italic;" th:text="${report.contentPreview}">Inhalt...</div>

                        <div th:if="${report.type == 'COURSE'}" style="margin-top: 0.5rem;">
                            <a th:href="@{'/courses/' + ${report.targetId}}" target="_blank" style="color: #7c3aed; font-size: 0.8rem;">Zum Kurs →</a>
                        </div>
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
                    <form th:action="@{/admin/reports/{id}/resolve(id=${report.id})}" method="post">
                        <input type="hidden" name="strike" value="true">
                        <button type="submit" class="btn-danger">Strike</button>
                    </form>
                    <form th:action="@{/admin/reports/{id}/resolve(id=${report.id})}" method="post">
                        <input type="hidden" name="strike" value="false">
                        <button type="submit" class="btn-secondary">Ignorieren</button>
                    </form>
                </div>

            </div>
        </div>

    </div>
</section>
</html>
