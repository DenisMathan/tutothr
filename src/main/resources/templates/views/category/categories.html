<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5" layout:decorate="~{layout}">

<head>
    <title th:text="#{categories.manage}">Kategorien verwalten</title>
</head>

<section layout:fragment="mybody">
    <div class="container" style="max-width: 1200px; margin: 2rem auto; padding: 0 1rem;">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1 class="text-main" style="margin: 0; font-weight: 700;" th:text="#{categories.title}">Kategorien</h1>
            <a th:href="@{/admin/categories/add}" class="btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                <span th:text="#{categories.new}">Neue Kategorie</span>
            </a>
        </div>

        <div class="table-wrapper">
            <table class="styled-table">
                <thead>
                <tr>
                    <th style="width: 80px;">ID</th>
                    <th th:text="#{categories.name}">Name</th>
                    <th th:text="#{categories.description}">Beschreibung</th>
                    <th class="text-end" style="width: 120px;" th:text="#{common.actions}">Aktionen</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="category : ${categories}">
                    <td class="text-muted" th:text="'#' + ${category.id}">#1</td>
                    <td style="font-weight: 600;" th:text="${category.title}">Titel</td>
                    <td class="text-muted" th:text="${category.description}">Beschreibung</td>
                    <td class="text-end">
                        <div style="display: flex; gap: 0.25rem; justify-content: flex-end;">
                            <a th:href="@{/admin/categories/update/{id}(id=${category.id})}"
                               class="btn-action"
                               th:title="#{common.edit}">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                </svg>
                            </a>
                            <form th:action="@{/admin/categories/delete/{id}(id=${category.id})}" method="post" th:object="${category}" style="display:inline;">
                                <input type="hidden" name="_method" value="delete" />
                                <button class="btn-action delete" th:title="#{common.delete}" th:onclick="'return confirm(\'' + #{categories.delete.confirm} + '\');'">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                    </svg>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</html>
