<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5" layout:decorate="~{layout}">

<head>
    <title>All Categories</title>
    <script th:inline="javascript">
        /* Console log to check if script is updated */
        console.log('Categories script loaded v4');

        function deleteCategory(id) {
            // Holen des CSRF-Tokens und Header-Namens aus den Meta-Tags
            // Wir holen sie hier drinnen, um sicherzustellen, dass das DOM geladen ist
            const token = document.querySelector("meta[name='_csrf']").getAttribute("content");
            const headerName = document.querySelector("meta[name='_csrf_header']").getAttribute("content");

            console.log('Deleting category with id: ' + id);

            if (confirm('Kategorie wirklich löschen?')) {
                fetch('/admin/categories/delete/' + id, {
                    method: 'DELETE',
                    headers: {
                        [headerName]: token
                    },
                    credentials: 'include' // Sendet Cookies (JSESSIONID) mit, falls nötig
                })
                    .then(response => {
                        if (response.ok) {
                            window.location.reload();
                        } else {
                            alert('Fehler beim Löschen!');
                        }
                    });
            }
        }
    </script>
</head>

<section layout:fragment="mybody">
    <div class="categories-container">
        <div class="categories-header">
            <h1 class="categories-title">Kategorien</h1>
            <a th:href="@{/admin/categories/add}" class="btn-primary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                Neue Kategorie
            </a>
        </div>

        <div class="categories-table-wrapper">
            <table class="categories-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Beschreibung</th>
                    <th class="text-end">Aktionen</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="category : ${categories}">
                    <td th:text="${category.id}">1</td>
                    <td th:text="${category.title}">Beispiel</td>
                    <td th:text="${category.description}">Beschreibung</td>
                    <td class="text-end">
                        <div class="action-buttons">
                            <a th:href="@{/admin/categories/add/{id}(id=${category.id})}"
                               class="btn-action btn-edit"
                               title="Bearbeiten">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                </svg>
                            </a>
                            <button class="btn-action btn-delete"
                                    th:onclick="|deleteCategory(${category.id})|"
                                    title="Löschen">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>

</html>
