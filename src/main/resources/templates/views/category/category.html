<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">

<head>
    <title th:if="${category.id != null}">Update ${category.title}</title>
    <title th:if="${category.id == null}">New Category</title>
</head>

<section layout:fragment="mybody">
    <div class="form-container">
        <div class="form-header">
            <h2 class="form-title" th:if="${category.id != null}" th:text="${category.title}"></h2>
            <h2 class="form-title" th:if="${category.id == null}">Neue Kategorie</h2>
        </div>

        <form th:action="@{/admin/categories/add/process}" th:object="${category}" method="post" class="dark-form">
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label for="title" class="form-label">Titel</label>
                <input type="text"
                       id="title"
                       th:field="*{title}"
                       class="form-input"
                       placeholder="Titel der Kategorie eingeben"
                       required/>
                <span th:if="${#fields.hasErrors('title')}"
                      th:errors="*{title}"
                      class="form-error"></span>
            </div>

            <div class="form-group">
                <label for="description" class="form-label">Beschreibung</label>
                <textarea id="description"
                          th:field="*{description}"
                          class="form-textarea"
                          rows="4"
                          placeholder="Beschreibung der Kategorie eingeben"></textarea>
            </div>

            <div class="form-actions">
                <a th:href="@{/admin/categories}" class="btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                    Abbrechen
                </a>
                <button type="submit" class="btn-primary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Speichern
                </button>
            </div>
        </form>
    </div>
</section>

</html>
