<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">
<head><title>Dashboard</title></head>

<section layout:fragment="mybody">
    <div class="container" style="padding: 2rem;">

        <h1 class="mb-4">Willkommen zurück, <span th:text="${user.username}">User</span>! 👋</h1>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem;">

            <div class="stat-card" onclick="window.location.href='/messages/inbox'" style="cursor: pointer;">
                <div class="icon-bg purple">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                </div>
                <div>
                    <div class="stat-value" th:text="${stats.unreadMessages}">0</div>
                    <div class="stat-label">Ungelesene Nachrichten</div>
                </div>
            </div>

            <div class="stat-card" th:if="${stats.activeCourses != null}">
                <div class="icon-bg blue">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                    </svg>
                </div>
                <div>
                    <div class="stat-value" th:text="${stats.activeCourses}">0</div>
                    <div class="stat-label">Meine Kurse</div>
                </div>
            </div>

            <div class="stat-card" th:if="${stats.totalRevenue != null}">
                <div class="icon-bg yellow">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="1" x2="12" y2="23"/>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                    </svg>
                </div>
                <div>
                    <div class="stat-value" th:text="${#numbers.formatDecimal(stats.totalRevenue, 1, 2) + ' €'}">0,00 €</div>
                    <div class="stat-label">Gesamtumsatz</div>
                </div>
            </div>

            <div class="stat-card" th:if="${stats.bestCourseTitle != null}" style="grid-column: span 1;">
                <div class="icon-bg green">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                        <polyline points="17 6 23 6 23 12"></polyline>
                    </svg>
                </div>
                <div>
                    <div class="stat-label" style="margin-bottom: 0.25rem;">Top Kurs 🏆</div>
                    <div class="stat-value" style="font-size: 1.1rem; line-height: 1.2; margin-bottom: 0;" th:text="${stats.bestCourseTitle}">Titel</div>
                    <div style="font-size: 0.85rem; color: #10b981; margin-top: 0.25rem;"
                         th:text="'+ ' + ${#numbers.formatDecimal(stats.bestCourseRevenue, 1, 2) + ' €'}">
                        + 500 €
                    </div>
                </div>
            </div>


            <div class="stat-card" th:if="${stats.myBookings != null}" onclick="window.location.href='/my-bookings'" style="cursor: pointer;">
                <div class="icon-bg green">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                </div>
                <div>
                    <div class="stat-value" th:text="${stats.myBookings}">0</div>
                    <div class="stat-label">Gebuchte Kurse</div>
                </div>
            </div>

            <div class="stat-card" th:if="${stats.totalSpent != null}">
                <div class="icon-bg red">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/>
                        <path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/>
                        <path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"/>
                    </svg>
                </div>
                <div>
                    <div class="stat-value" th:text="${#numbers.formatDecimal(stats.totalSpent, 1, 2) + ' €'}">0,00 €</div>
                    <div class="stat-label">Gesamtausgaben</div>
                    <div style="font-size: 0.8rem; color: #9aa4b2; margin-top: 0.25rem;">
                        <span th:text="${#numbers.formatDecimal(stats.spentLastMonth, 1, 2) + ' €'}">0 €</span> letzten Monat
                    </div>
                </div>
            </div>

        </div>

        <div style="margin-top: 3rem;">
            <h3 style="color: #e6eef8; margin-bottom: 1rem;">Schnellzugriff</h3>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">

                <a th:href="@{/courses/create}" class="btn-primary" th:if="${stats.activeCourses != null}">
                    + Kurs erstellen
                </a>
                <a th:href="@{/tutor/bookings}" class="btn-secondary" th:if="${stats.receivedBookings != null}">
                    Buchungen verwalten
                </a>

                <a th:href="@{/courses}" class="btn-primary" th:if="${stats.myBookings != null}">
                    Neue Kurse entdecken
                </a>
                <a th:href="@{/my-bookings}" class="btn-secondary" th:if="${stats.myBookings != null}">
                    Zu meinen Buchungen
                </a>

            </div>
        </div>
    </div>

    <style>
        .stat-card {
            background: #0b1220;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.2s ease;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(124, 58, 237, 0.3);
            background: #0f1729;
        }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: #e6eef8; margin-bottom: 0.25rem; }
        .stat-label { color: #9aa4b2; font-size: 0.875rem; font-weight: 500; }

        .icon-bg {
            width: 48px; height: 48px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .purple { background: rgba(124, 58, 237, 0.1); color: #7c3aed; border: 1px solid rgba(124, 58, 237, 0.2); }
        .blue { background: rgba(59, 130, 246, 0.1); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.2); }
        .yellow { background: rgba(251, 191, 36, 0.1); color: #fbbf24; border: 1px solid rgba(251, 191, 36, 0.2); }
        .green { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .red { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
    </style>
</section>
</html>
