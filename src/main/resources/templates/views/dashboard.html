<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml" layout:decorate="~{layout}">
<head><title>Dashboard</title></head>

<section layout:fragment="mybody">
    <div class="container" style="padding: 2rem;">

        <h1 class="mb-4">Willkommen zurück, <span th:text="${user.username}">User</span>!</h1>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem;">

            <div class="stat-card" onclick="window.location.href='/messages/inbox'">
                <div class="icon-bg purple">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                </div>
                <div>
                    <div class="stat-value" th:text="${stats.unreadMessages}">0</div>
                    <div class="stat-label">Ungelesene Nachrichten</div>
                </div>
            </div>

            <div class="stat-card" th:if="${stats.activeCourses != null}">
                <div class="icon-bg blue">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                    </svg>
                </div>
                <div>
                    <div class="stat-value" th:text="${stats.activeCourses}">0</div>
                    <div class="stat-label">Meine Kurse</div>
                </div>
            </div>

            <div class="stat-card" th:if="${stats.totalRevenue != null}">
                <div class="icon-bg yellow">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="1" x2="12" y2="23"/>
                        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                    </svg>
                </div>
                <div>
                    <div class="stat-value" th:text="${#numbers.formatDecimal(stats.totalRevenue, 1, 2) + ' €'}">0,00 €</div>
                    <div class="stat-label">Gesamtumsatz</div>
                </div>
            </div>

        </div>

        <div style="margin-top: 3rem;" sec:authorize="hasRole('STUDENT')">
            <h3 class="mb-3 text-main">Schnellzugriff</h3>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <a th:href="@{/courses}" class="btn-primary">Neue Kurse entdecken</a>
                <a th:href="@{/messages/inbox}" class="btn-secondary">Nachrichten</a>
                <a th:href="@{/my-bookings}" class="btn-secondary">Buchungen</a>
                <a th:href="@{/tutor/bookings}" class="btn-secondary" sec:authorize="hasRole('TUTOR')">Erhaltene Buchungen</a>
            </div>
        </div>

        <div style="margin-top: 3rem;" sec:authorize="hasRole('ADMIN')">
            <h3 class="mb-3 text-main">Admin-Bereich</h3>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <a th:href="@{/admin/all}" class="btn-secondary">User-Management</a>
                <a th:href="@{/admin/categories}" class="btn-secondary">Kategorie Management</a>
                <a th:href="@{/admin/reports}" class="btn-secondary">Moderation</a>
            </div>
        </div>


    </div>
</section>
</html>
