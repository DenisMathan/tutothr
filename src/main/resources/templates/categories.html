<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">
<head>
    <title>All Users</title>
</head>

<section layout:fragment="mybody">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Kategorien</h1>
            <a th:href="@{/categories/new}" class="btn btn-primary">Neue Kategorie</a>
        </div>

        <!-- Falls keine Kategorien vorhanden sind -->
        <div th:if="${#lists.isEmpty(categories)}" class="alert alert-info">
            Es sind keine Kategorien vorhanden.
        </div>

        <!-- Liste der Kategorien -->
        <table th:if="${!#lists.isEmpty(categories)}" class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Beschreibung</th>
                    <th class="text-end">Aktionen</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="category : ${categories}">
                    <td th:text="${category.id}">1</td>
                    <td th:text="${category.title}">Beispiel</td>
                    <td th:text="${category.description}">Beschreibung</td>
                    <td class="text-end">
                        <a th:href="@{/categories/{id}(id=${category.id})}" class="btn btn-sm btn-outline-secondary me-1">Ansehen</a>
                        <a th:href="@{/categories/{id}/edit(id=${category.id})}" class="btn btn-sm btn-outline-primary me-1">Bearbeiten</a>
                        <form th:action="@{/categories/{id}(id=${category.id})}" method="post" th:object="${category}" style="display:inline;">
                            <input type="hidden" name="_method" value="delete"/>
                            <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Kategorie löschen?');">Löschen</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>

</html>
