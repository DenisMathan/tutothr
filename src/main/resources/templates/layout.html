<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head>
	<title>TutoHR Platform</title>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

	<script>
		(function() {
			const savedTheme = localStorage.getItem('theme');
			const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
			if (savedTheme === 'dark' || (!savedTheme && systemTheme)) {
				document.documentElement.setAttribute('data-theme', 'dark');
			} else {
				document.documentElement.setAttribute('data-theme', 'light');
			}
		})();
	</script>

	<meta name="_csrf" th:content="${_csrf.token}" />
	<meta name="_csrf_header" th:content="${_csrf.headerName}" />

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
	<link href="/webjars/open-iconic/font/css/open-iconic-bootstrap.min.css" rel="stylesheet" />
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>

	<link href="/css/style.css" rel="stylesheet" />
	<link href="/css/pagination.css" rel="stylesheet" />
</head>

<body>

<header>
	<div align="top" th:replace="~{fragments/navbar/navbar::navbar}"></div>
</header>

<div class="layout-main">
	<section layout:fragment="mybody" class="w-100">
	</section>
</div>

<footer class="layout-footer">
	<div th:replace="~{fragments/footer::footer}"></div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
	function toggleTheme() {
		const html = document.documentElement;
		const current = html.getAttribute('data-theme');
		const next = current === 'dark' ? 'light' : 'dark';

		html.setAttribute('data-theme', next);
		localStorage.setItem('theme', next);
		updateThemeIcons();
	}

	function updateThemeIcons() {
		const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
		const sun = document.getElementById('icon-sun');
		const moon = document.getElementById('icon-moon');

		if(sun && moon) {
			sun.style.display = isDark ? 'block' : 'none';
			moon.style.display = isDark ? 'none' : 'block';
		}
	}

	// Init Icons on load
	document.addEventListener('DOMContentLoaded', updateThemeIcons);

	// CSRF Setup für AJAX
	$(function () {
		var token = $("meta[name='_csrf']").attr("content");
		var header = $("meta[name='_csrf_header']").attr("content");
		$(document).ajaxSend(function (e, xhr, options) {
			if (options.type == "POST") {
				xhr.setRequestHeader(header, token);
			}
		});
	});
</script>
</body>
</html>
