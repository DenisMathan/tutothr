<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head>
    <title>Login</title>
    <!-- Bootstrap core CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="/webjars/open-iconic/font/css/open-iconic-bootstrap.min.css" rel="stylesheet" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <!-- <link href="/css/style.css" rel="stylesheet" /> -->
</head>

<body>
    <div class="container" style="max-width: 420px; margin-top: 60px;">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title mb-3">Login</h3>

                <div th:if="${param.error}" class="alert alert-danger" role="alert">
                    Ungültiger Benutzername oder Passwort.
                </div>
                <div th:if="${param.logout}" class="alert alert-success" role="alert">
                    Du wurdest erfolgreich abgemeldet.
                </div>

                <!-- statische action + Thymeleaf-Fallback -->
                <form th:action="@{/login}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label for="username" class="form-label">Benutzername</label>
                        <input id="username" name="username" type="text" class="form-control" required autofocus />
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Passwort</label>
                        <input id="password" name="password" type="password" class="form-control" required />
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Anmelden</button>
                    </div>
                </form>

                <hr />
                <p class="small">Kein Konto? <a th:href="@{/register}">Registrieren</a></p>
            </div>
        </div>
    </div>
</body>

</html>
