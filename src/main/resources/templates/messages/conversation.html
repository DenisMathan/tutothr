<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}">
<head>
    <title>Konversation</title>
    <!-- SockJS und STOMP Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>

<section layout:fragment="mybody">
    <div class="container" style="max-width: 900px; margin: 0 auto; padding: 2rem 1rem;">

        <!-- Header mit Zurück-Button -->
        <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
            <a th:href="@{/messages/inbox}" class="btn-secondary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Zurück
            </a>

            <!-- Chat Partner Info -->
            <div style="display: flex; align-items: center; gap: 0.75rem; flex: 1;">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="background: rgba(124, 58, 237, 0.1); border-radius: 50%; padding: 0.5rem;">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <div>
                    <div style="font-weight: 600; color: #e6eef8;" th:text="${otherUser.username}">
                        User Name
                    </div>
                    <div style="font-size: 0.875rem; color: #9aa4b2;" th:text="'@' + ${otherUser.username}">
                        @username
                    </div>
                </div>
                <!-- "tippt gerade..." Anzeige -->
                <div id="typing-indicator" style="display: none; font-size: 0.875rem; color: #7c3aed; font-style: italic;">
                    tippt gerade...
                </div>
            </div>
        </div>

        <!-- Chat-Bereich -->
        <div style="background: #0b1220; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; overflow: hidden;">

            <!-- Nachrichten-Liste -->
            <div id="messages-container" style="padding: 1.5rem; max-height: 500px; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem;">

                <!-- Keine Nachrichten -->
                <div th:if="${#lists.isEmpty(messages)}" id="no-messages" style="text-align: center; padding: 2rem; color: #9aa4b2;">
                    Noch keine Nachrichten in dieser Konversation
                </div>

                <!-- Nachricht (von anderem User) -->
                <div th:each="message : ${messages}"
                     th:if="${message.sender.id != currentUserId}"
                     th:data-message-id="${message.id}"
                     class="message-bubble message-received"
                     style="display: flex; justify-content: flex-start;">
                    <div style="max-width: 70%; background: rgba(124, 58, 237, 0.1); border: 1px solid rgba(124, 58, 237, 0.2); border-radius: 12px 12px 12px 4px; padding: 1rem;">
                        <div style="font-size: 0.75rem; color: #7c3aed; font-weight: 600; margin-bottom: 0.5rem;">
                            <span th:text="${message.sender.username}">Sender</span>
                        </div>
                        <p style="color: #e6eef8; margin: 0 0 0.5rem 0; word-wrap: break-word;" th:text="${message.content}">
                            Nachrichtentext
                        </p>
                        <div style="font-size: 0.75rem; color: #9aa4b2; text-align: right;" th:text="${#temporals.format(message.sentAt, 'HH:mm')}">
                            12:00
                        </div>
                    </div>
                </div>

                <!-- Nachricht (von mir) -->
                <div th:each="message : ${messages}"
                     th:if="${message.sender.id == currentUserId}"
                     th:data-message-id="${message.id}"
                     class="message-bubble message-sent"
                     style="display: flex; justify-content: flex-end;">
                    <div style="max-width: 70%; background: #7c3aed; border-radius: 12px 12px 4px 12px; padding: 1rem;">
                        <p style="color: white; margin: 0 0 0.5rem 0; word-wrap: break-word;" th:text="${message.content}">
                            Meine Nachricht
                        </p>
                        <div style="font-size: 0.75rem; color: rgba(255,255,255,0.7); text-align: right;" th:text="${#temporals.format(message.sentAt, 'HH:mm')}">
                            12:00
                        </div>
                    </div>
                </div>

            </div>

            <!-- Antwort-Formular -->
            <form id="message-form" style="border-top: 1px solid rgba(255,255,255,0.06); padding: 1.5rem;">

                <div style="display: flex; gap: 1rem; align-items: flex-end;">
                    <div style="flex: 1;">
                        <textarea
                                id="message-input"
                                class="form-input"
                                rows="3"
                                placeholder="Schreibe eine Antwort..."
                                required
                                minlength="1"
                                maxlength="1000"
                                style="resize: vertical; min-height: 60px;"></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="height: fit-content; white-space: nowrap;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                        Senden
                    </button>
                </div>

            </form>

        </div>

    </div>

    <!-- WEBSOCKET SCRIPT -->
    <script th:inline="javascript">
        // Thymeleaf variables
        const otherUserId = /*[[${otherUser.id}]]*/ 0;
        const currentUserId = /*[[${currentUserId}]]*/ 0;
        const otherUserName = /*[[${otherUser.username}]]*/ 'User';

        let stompClient = null;
        let typingTimeout = null;

        let messageSubscription = null;
        let typingSubscription = null;
        let readSubscription = null;


        function connect() {
            // Falls bereits verbunden, erst trennen (verhindert Zombie-Verbindungen)
            if (stompClient !== null && stompClient.connected) {
                stompClient.disconnect();
            }

            const socket = new SockJS('/ws', null, {
                transports: ['websocket', 'xhr-streaming', 'xhr-polling']
            });

            stompClient = Stomp.over(socket);
            // Debug-Ausgaben deaktivieren, falls sie stören
            // stompClient.debug = null;

            stompClient.connect({}, onConnected, onError);
        }

        function onConnected() {
            console.log('WebSocket verbunden!');

            // WICHTIG: Alte Subscriptions löschen, bevor neue erstellt werden!
            if (messageSubscription) messageSubscription.unsubscribe();
            if (typingSubscription) typingSubscription.unsubscribe();
            if (readSubscription) readSubscription.unsubscribe();

            // Neu abonnieren und Referenzen speichern
            messageSubscription = stompClient.subscribe('/user/queue/messages', onMessageReceived);
            typingSubscription = stompClient.subscribe('/user/queue/typing', onTypingReceived);
            readSubscription = stompClient.subscribe('/user/queue/read', onReadReceived);

            // Initial lesen markieren
            sendReadNotification();
        }

        function onError(error) {
            console.error('WebSocket Verbindungsfehler:', error);
            // Retry nach 5 Sekunden
            setTimeout(connect, 5000);
        }


        function sendMessage(event) {
            event.preventDefault();

            const messageInput = document.getElementById('message-input');
            const content = messageInput.value.trim();

            if (content && stompClient) {
                const chatMessage = {
                    receiverId: otherUserId,
                    content: content,
                    courseId: null
                };

                // Nur senden. NICHT lokal hinzufügen (das macht onMessageReceived)
                stompClient.send("/app/chat", {}, JSON.stringify(chatMessage));

                messageInput.value = '';
            }
        }


        function onMessageReceived(payload) {
            const message = JSON.parse(payload.body);

            // Double-Check: Verhindern, dass Nachricht doppelt eingefügt wird (falls ID vorhanden)
            // Prüfen, ob eine Nachricht mit dieser ID schon im DOM ist
            if (message.id && document.querySelector(`.message-bubble[data-message-id="${message.id}"]`)) {
                return; // Nachricht existiert schon -> Abbrechen
            }

            // Entferne "Keine Nachrichten" Placeholder
            const noMessages = document.getElementById('no-messages');
            if (noMessages) {
                noMessages.remove();
            }

            // Füge Nachricht hinzu
            const container = document.getElementById('messages-container');
            const messageBubbleHTML = createMessageBubble(message);

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = messageBubbleHTML;
            const newElement = tempDiv.firstElementChild;

            // Neue ID sicher als Zahl parsen
            const newMsgId = Number(message.id);

            const allMessages = Array.from(container.querySelectorAll('.message-bubble'));
            let inserted = false;

            // Rückwärts suchen
            for (let i = allMessages.length - 1; i >= 0; i--) {
                const existingRow = allMessages[i];

                // Dataset ist der moderne Weg, data-message-id zu lesen
                // Fallback auf getAttribute für ältere Browser
                const rawId = existingRow.dataset.messageId || existingRow.getAttribute('data-message-id');
                const existingId = Number(rawId);

                // DEBUGGING: Falls die Reihenfolge komisch ist, schau in die Konsole (F12)
                // console.log(`Vergleiche: Alt(${existingId}) < Neu(${newMsgId}) ?`, existingId < newMsgId);

                if (!isNaN(existingId) && existingId < newMsgId) {
                    existingRow.insertAdjacentElement('afterend', newElement);
                    inserted = true;
                    break;
                }
            }

            // Wenn keine ältere Nachricht gefunden wurde (oder Liste leer), ab nach oben
            if (!inserted) {
                container.insertAdjacentElement('afterbegin', newElement);
            }

            // Scroll zu neuester Nachricht
            container.scrollTop = container.scrollHeight;

            // Wenn Nachricht vom anderen User, markiere als gelesen
            if (message.senderId === otherUserId) {
                sendReadNotification();
            }
        }

        function createMessageBubble(message) {
            const isFromMe = message.senderId === currentUserId;
            // Fallback für Zeit, falls sentAt null ist (beim direkten Senden manchmal der Fall)
            const dateObj = message.sentAt ? new Date(message.sentAt) : new Date();
            const time = dateObj.toLocaleTimeString('de-DE', {
                hour: '2-digit',
                minute: '2-digit'
            });

            // HTML Escape für Sicherheit
            const safeContent = escapeHtml(message.content);
            const safeSender = escapeHtml(message.senderName || 'User');
            // Nutze ID wenn vorhanden, sonst Timestamp als Fallback für Duplikat-Check
            const msgId = message.id || ('temp-' + Date.now());

            if (isFromMe) {
                return `
                    <div class="message-bubble message-sent" data-message-id="${msgId}" style="display: flex; justify-content: flex-end; animation: slideIn 0.3s;">
                        <div style="max-width: 70%; background: #7c3aed; border-radius: 12px 12px 4px 12px; padding: 1rem;">
                            <p style="color: white; margin: 0 0 0.5rem 0; word-wrap: break-word;">${safeContent}</p>
                            <div style="font-size: 0.75rem; color: rgba(255,255,255,0.7); text-align: right;">${time}</div>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="message-bubble message-received" data-message-id="${msgId}" style="display: flex; justify-content: flex-start; animation: slideIn 0.3s;">
                        <div style="max-width: 70%; background: rgba(124, 58, 237, 0.1); border: 1px solid rgba(124, 58, 237, 0.2); border-radius: 12px 12px 12px 4px; padding: 1rem;">
                            <div style="font-size: 0.75rem; color: #7c3aed; font-weight: 600; margin-bottom: 0.5rem;">${safeSender}</div>
                            <p style="color: #e6eef8; margin: 0 0 0.5rem 0; word-wrap: break-word;">${safeContent}</p>
                            <div style="font-size: 0.75rem; color: #9aa4b2; text-align: right;">${time}</div>
                        </div>
                    </div>
                `;
            }
        }


        function onTyping() {
            if (stompClient) {
                stompClient.send("/app/typing", {}, JSON.stringify({ receiverId: otherUserId }));
            }
        }

        function onTypingReceived(payload) {
            const notification = JSON.parse(payload.body);
            if (notification.senderId === otherUserId) {
                showTypingIndicator();
            }
        }

        function showTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            indicator.style.display = 'block';
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => { indicator.style.display = 'none'; }, 3000);
        }

        function sendReadNotification() {
            if (stompClient) {
                stompClient.send("/app/read", {}, JSON.stringify({ otherUserId: otherUserId }));
            }
        }

        function onReadReceived(payload) {
            console.log('Nachricht wurde gelesen');
        }

        function escapeHtml(text) {
            if (!text) return "";
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }


        document.getElementById('message-form').addEventListener('submit', sendMessage);

        const messageInput = document.getElementById('message-input');
        let lastTypingTime = 0;
        messageInput.addEventListener('input', () => {
            const now = Date.now();
            if (now - lastTypingTime > 2000) {
                onTyping();
                lastTypingTime = now;
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('messages-container');
            if (container) container.scrollTop = container.scrollHeight;
            connect();
        });

        window.addEventListener('beforeunload', () => {
            if (stompClient) stompClient.disconnect();
        });
    </script>

    <!-- STYLES & ANIMATIONS -->
    <style>
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #messages-container::-webkit-scrollbar {
            width: 8px;
        }

        #messages-container::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
            border-radius: 4px;
        }

        #messages-container::-webkit-scrollbar-thumb {
            background: rgba(124, 58, 237, 0.3);
            border-radius: 4px;
        }

        #messages-container::-webkit-scrollbar-thumb:hover {
            background: rgba(124, 58, 237, 0.5);
        }

        #typing-indicator {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</section>
</html>
