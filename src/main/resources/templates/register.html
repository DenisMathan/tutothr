<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Registrierung</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
    <style>
        .card-register { max-width: 520px; margin-top: 60px; }
        .pw-note { font-size: .9rem; color: #6c757d; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="card card-register shadow-sm">
        <div class="card-body p-4">
            <h3 class="card-title mb-3 text-center">Neues Konto erstellen</h3>
            <div th:if="${param.success}" class="alert alert-success" role="alert">
                Registrierung erfolgreich. Bitte melde dich an.
            </div>
            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                Registrierung fehlgeschlagen. Prüfe die Eingaben.
            </div>

            <form th:action="@{/register}" method="post" id="registerForm" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label for="username" class="form-label">Benutzername</label>
                    <input id="username" name="username" type="text" class="form-control" required minlength="3"
                           placeholder="z. B. max.mustermann" autofocus/>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E‑Mail</label>
                    <input id="email" name="email" type="email" class="form-control" required
                           placeholder="name@beispiel.de"/>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Passwort</label>
                    <input id="password" name="password" type="password" class="form-control" required minlength="8"
                           placeholder="Mind. 8 Zeichen"/>
                    <div class="pw-note mt-1">Mindestens 8 Zeichen. Groß-/Kleinbuchstaben und Zahlen empfohlen.</div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Passwort wiederholen</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" required
                           placeholder="Passwort erneut eingeben"/>
                    <div id="pwMismatch" class="form-text text-danger visually-hidden">Passwörter stimmen nicht überein.</div>
                </div>

                <div class="d-grid gap-2">
                    <button id="submitBtn" type="submit" class="btn btn-primary">Registrieren</button>
                </div>
            </form>

            <hr/>
            <p class="small text-center mb-0">
                Schon ein Konto? <a th:href="@{/login}">Anmelden</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
